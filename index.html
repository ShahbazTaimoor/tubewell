<!doctype html>
<html lang="ur-Latn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Aslam Tubewell"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B3C6B">
<title>Aslam Tubewell App</title>
<style>
:root{--h1:#0B3C6B;--h2:#1580B8;--pt:#fff;--g:#0E6A99;--g2:#E1F1FA;--ink:#12283D;--mut:#5F7487;--line:#D9E6EF;--bg:#F2F7FB;--card:#fff;--red:#B4373F;--redbg:#FDEBEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4FB3E8;--g2:#16303F;--ink:#E4EFF7;--mut:#8FA6B8;--line:#25404F;--bg:#0E1A24;--card:#14232F;--red:#ff8a8a;--redbg:#3A2124}}
:root[data-theme="dark"]{--g:#4FB3E8;--g2:#16303F;--ink:#E4EFF7;--mut:#8FA6B8;--line:#25404F;--bg:#0E1A24;--card:#14232F;--red:#ff8a8a;--redbg:#3A2124}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,"Segoe UI",Arial,sans-serif}
.app{max-width:640px;margin:auto;padding:0 14px 40px}
.top{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:22px 16px;border-radius:0 0 22px 22px;margin:0 -14px 14px}
.top h1{margin:0;font-size:23px}.top small{opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:700}
.p{background:var(--g);color:var(--pt)}.s{background:var(--g2);color:var(--g)}.d{background:var(--redbg);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{text-align:center;padding:18px}.big span{font-size:13px;color:var(--mut)}.big strong{display:block;font-size:34px;margin-top:4px;color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:var(--bg);border-radius:10px;padding:10px}
.grid span{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}.grid b{font-size:15px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.f label{font-size:13px;font-weight:700;color:var(--mut)}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.fm{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:14px;margin-bottom:9px;border-radius:14px}
.fm small{display:block;color:var(--mut);font-weight:400;margin-top:3px}
.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:var(--g2);color:var(--g);white-space:nowrap}.pill.r{background:var(--redbg);color:var(--red)}
h2{font-size:17px;margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:12px}
.prev{background:var(--g2);color:var(--g);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;font-weight:700}
.ent{border-top:1px solid var(--line);padding:11px 0}.ent:first-of-type{border:0}
.ent .h{display:flex;justify-content:space-between;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:18px}
.hide{display:none!important}
.mini{padding:6px 10px;font-size:12px}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.f{min-width:0}
.bar{height:10px;background:var(--g2);border-radius:99px;overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.it{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}.it:first-of-type{border:0}
.db{min-width:56px;text-align:center;background:var(--g2);color:var(--g);border-radius:12px;padding:7px 4px}.db b{display:block;font-size:21px;line-height:1.1}.db span{display:block;font-size:10px}
.it.pay .db{background:#fff4d6;color:#8a6200}
.im{flex:1;min-width:0}.im b{font-size:14px}.im small{display:block;color:var(--mut);margin-top:3px}
.ac{display:flex;gap:6px;margin-top:8px}.ia{text-align:right;white-space:nowrap}.ia b{display:block;font-size:15px}.ia small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.pos{color:var(--g)}.neg{color:var(--red)}
.call{background:var(--g);color:var(--pt);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:12px;white-space:nowrap}
.top{position:relative}.th{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.2);color:#fff;padding:8px 12px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);color:var(--ink);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.to{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;margin-bottom:8px;padding:12px}.to.on{border-color:var(--g)}.to b{flex:1}
.sw{width:58px;height:40px;border-radius:10px;position:relative;display:block;overflow:hidden}.sw i{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%}.sw i:first-child{left:8px}.sw i:last-child{left:30px}
</style></head>
<body><div class="app">
<header class="top"><button class="th" onclick="thPick()">🎨 Theme</button><small>Pani ka hisab</small><h1>💧 Aslam Tubewell App</h1><small>Rate: Rs 500 fi ghanta • v9</small><div class="sm" id="sync" style="margin-top:6px;opacity:.9">Check ho raha hai…</div></header>
<div id="v"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const RATE=500,KEY='aslam_tubewell_v1';
let db={farmers:[],ts:0},cur=null,dl=null,timer=null,U=null,FS=null,AU=null,lastP={},unsub=null;
try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r)}catch(e){}
function st(t){const s=document.getElementById('sync');if(s)s.textContent=t}
const sig=f=>JSON.stringify([f.name,f.phone,f.addr,f.entries,f.pays]);
function push(){if(!U||!FS)return;clearTimeout(timer);timer=setTimeout(async()=>{try{
const col=FS.collection('users').doc(U.uid).collection('farmers'),bt=FS.batch();let n=0;
db.farmers.forEach(f=>{const g=sig(f);if(lastP[f.id]!==g){f.ts=Date.now();bt.set(col.doc(f.id),{json:JSON.stringify(f),ts:f.ts});lastP[f.id]=g;n++}});
Object.keys(lastP).forEach(id=>{if(!db.farmers.some(f=>f.id===id)){bt.delete(col.doc(id));delete lastP[id];n++}});
if(n){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}await bt.commit()}
st('☁️ Online save ho gaya')}catch(e){st('⚠️ Online save nahi hua (phone mein save hai)')}},500)}
const save=()=>{db.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}push()};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs '+Math.round(n).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=m=>m<=0?'0 min':((m>=60?(Math.floor(m/60)===1?'1 ghanta':Math.floor(m/60)+' ghantay'):'')+(m>=60&&m%60?' ':'')+(m%60?m%60+' min':''));
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+a};
const mins=(s,e)=>{if(!s||!e)return 0;const a=s.split(':'),b=e.split(':');let m=(b[0]*60+ +b[1])-(a[0]*60+ +a[1]);if(m<0)m+=1440;return m};
const tot=f=>{const bill=f.entries.reduce((a,e)=>a+e.amt,0),paid=f.pays.reduce((a,p)=>a+p.amt,0),mn=f.entries.reduce((a,e)=>a+e.mins,0);return{bill,paid,mn,due:bill-paid}};
const dueP=t=>`<span class="pill ${t.due>0?'r':''}">${t.due>0?'Baqaya '+rs(t.due):t.due<0?'Ziada '+rs(-t.due):'Hisab saaf'}</span>`;

function listH(q){q=(q||'').trim().toLowerCase();const a=db.farmers.filter(f=>!q||(f.name+' '+f.phone+' '+f.addr).toLowerCase().includes(q));
return a.length?a.map(f=>{const t=tot(f);return`<button class="fm" onclick="open_('${f.id}')"><div><b>${esc(f.name)}</b><small>${esc([f.phone,f.addr].filter(Boolean).join(' • ')||'—')} • ${dur(t.mn)||'0 min'}</small></div>${dueP(t)}</button>`}).join(''):'<div class="empty">'+(db.farmers.length?'Koi kisan nahi mila.':'Abhi koi kisan nahi. Upar se "Naya Kisan" dabayein.')+'</div>'}
function filt(){$('list').innerHTML=listH($('q').value)}
function home(){cur=null;
const all=db.farmers.map(tot),bill=all.reduce((a,t)=>a+t.bill,0),paid=all.reduce((a,t)=>a+t.paid,0);
$('v').innerHTML=`<div class="card big"><span>Meri Total Kamai</span><strong>${rs(bill)}</strong>
<div class="grid" style="margin-top:12px;text-align:left"><div><span>Wasool hua</span><b>${rs(paid)}</b></div><div><span>Baqaya</span><b>${rs(bill-paid)}</b></div></div></div>
<button class="p" style="width:100%;margin-bottom:12px" onclick="$('addBox').classList.toggle('hide')">＋ Naya Kisan</button>
<div id="addBox" class="card hide"><h2>Naya Kisan</h2>
<div class="f"><label>Kisan ka naam</label><input id="fn" placeholder="Naam"></div>
<div class="f"><label>Number</label><input id="fp" type="tel" placeholder="03xx-xxxxxxx"></div>
<div class="f"><label>Rehaish</label><input id="fa" placeholder="Gaon / ilaqa"></div>
<button class="p" style="width:100%" onclick="addF()">Save karein</button></div>
${db.farmers.length?'<input id="q" type="search" placeholder="🔍 Kisan ka naam dhoondein" oninput="filt()" style="margin-bottom:10px">':''}<div id="list">${listH('')}</div>
<div class="card" style="margin-top:14px"><h2>Backup</h2><div class="row"><button class="s" onclick="bk()">⬇ Backup download</button><button class="s" onclick="$('imp').click()">⬆ Backup wapas</button></div><input id="imp" type="file" accept=".json,application/json" class="hide" onchange="imp(this)"></div><div class="card"><h2>Account</h2><div class="mut sm" style="margin-bottom:10px">${esc(U?U.email:'Login nahi')}</div><button class="d" style="width:100%" onclick="logout()">Logout</button></div>`}

function addF(){const n=$('fn').value.trim();if(!n){alert('Kisan ka naam likhein');return}
db.farmers.push({id:uid(),name:n,phone:$('fp').value.trim(),addr:$('fa').value.trim(),entries:[],pays:[]});save();home()}

let eid=null;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dbx=d=>{const[y,m,dd]=d.split('-');return`<div class="db"><b>${+dd}</b><span>${MN[m-1]}</span><span>${y}</span></div>`};
function open_(id,ed){cur=id;eid=ed||null;const f=db.farmers.find(x=>x.id===id);if(!f)return home();const t=tot(f),E=eid?f.entries.find(x=>x.id===eid):null;
const pct=t.bill>0?Math.min(100,Math.round(t.paid/t.bill*100)):0;
const L=[...f.entries.map(o=>({k:'e',d:o.date,s:o.start,o})),...f.pays.map(o=>({k:'p',d:o.date,s:'99',o}))].sort((a,b)=>(a.d+a.s).localeCompare(b.d+b.s));
let run=0;L.forEach(r=>{run+=r.k==='e'?r.o.amt:-r.o.amt;r.run=run});L.reverse();
$('v').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="s" onclick="home()">← Wapas</button><button class="s" onclick="editF()">✎ Kisan edit</button></div>
<div class="card"><h2 style="margin:0">${esc(f.name)}</h2><div class="mut" style="margin-top:8px">🏠 ${esc(f.addr||'—')}</div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px"><span>📞 ${esc(f.phone||'Number nahi likha')}</span>${f.phone?`<a class="call" href="tel:${f.phone.replace(/[^\d+]/g,'')}">📞 Call karein</a>`:''}</div></div>
<div class="card"><h2>Is kisan ka poora hisab</h2><div class="grid">
<div><span>Total time</span><b>${dur(t.mn)||'0 min'}</b></div><div><span>Total paisay</span><b>${rs(t.bill)}</b></div>
<div><span>Wasool hua</span><b class="pos">${rs(t.paid)}</b></div><div><span>Baqaya</span><b style="color:${t.due>0?'var(--red)':'var(--g)'}">${rs(t.due)}</b></div></div>
<div class="bar"><i style="width:${pct}%"></i></div><div class="mut sm">${pct}% wasool • ${f.entries.length} entries</div></div>
<div class="row" style="margin-bottom:12px"><button class="p" onclick="sheet()">🖼 Hisab ki tasveer</button><button class="s" onclick="sendS()">📝 Message</button></div><div id="sbox"></div>
<div class="card" id="fm"><h2>${E?'✎ Entry edit karein':'💧 Pani ki nayi entry'}</h2>
<div class="f"><label>Date</label><input id="ed" type="date" value="${E?E.date:today()}"></div>
<div class="row"><div class="f"><label>Pani shuru (time)</label><input id="es" type="time" value="${E?E.start:''}" oninput="pv()"><button class="s mini" onclick="$('es').value=nowT();pv()">Abhi</button></div>
<div class="f"><label>Pani khatam (time)</label><input id="ee" type="time" value="${E?E.end:''}" oninput="pv()"><button class="s mini" onclick="$('ee').value=nowT();pv()">Abhi</button></div></div>
<div class="prev"><span>Total time: <span id="pt">—</span></span><span id="pa">Rs 0</span></div>
<div class="f"><label>Note (marzi)</label><input id="en" placeholder="Jaise: gandum ka pani" value="${esc(E?E.note:'')}"></div>
<button class="p" style="width:100%" onclick="addE()">${E?'Tabdeeli save karein':'Entry save karein'}</button>${E?'<button class="s" style="width:100%;margin-top:8px" onclick="open_(cur)">Cancel</button>':''}</div>
<div class="card"><h2>💰 Paisay wasool kiye</h2><div class="row"><div class="f"><label>Rakam</label><input id="pm" type="number" inputmode="numeric" placeholder="Rs"></div><div class="f"><label>Date</label><input id="pd" type="date" value="${today()}"></div></div>
<button class="s" style="width:100%" onclick="addP()">Wasooli save karein</button></div>
<div class="card"><h2>📒 Poori kitab (${L.length})</h2>${L.length?L.map(r=>{const o=r.o,bq=r.run;const sub='Baqaya '+rs(bq);
return r.k==='e'?`<div class="it">${dbx(o.date)}<div class="im"><b>💧 ${t12(o.start)} → ${t12(o.end)}</b><small>${dur(o.mins)}${o.note?' • '+esc(o.note):''}</small><div class="ac"><button class="s mini" onclick="open_('${f.id}','${o.id}');window.scrollTo(0,0)">✎ Edit</button><button class="d mini" onclick="delE('${o.id}')">🗑 Delete</button></div></div><div class="ia"><b>${rs(o.amt)}</b><small class="${bq>0?'neg':''}">${sub}</small></div></div>`
:`<div class="it pay">${dbx(o.date)}<div class="im"><b>💰 Wasooli</b><small>Paisay jama hue</small><div class="ac"><button class="d mini" onclick="delP('${o.id}')">🗑 Delete</button></div></div><div class="ia"><b class="pos">− ${rs(o.amt)}</b><small class="${bq>0?'neg':''}">${sub}</small></div></div>`}).join(''):'<div class="empty">Abhi koi entry nahi.</div>'}</div>
<button class="d" style="width:100%" onclick="delF()">🗑 Yeh Kisan Delete karein</button>`;if(E)pv()}

function pv(){const m=mins($('es').value,$('ee').value);$('pt').textContent=m?dur(m):'—';$('pa').textContent=rs(m/60*RATE)}
const F=()=>db.farmers.find(x=>x.id===cur);
function addE(){const s=$('es').value,e=$('ee').value,d=$('ed').value;if(!d||!s||!e){alert('Date, shuru aur khatam time likhein');return}
const m=mins(s,e);if(!m){alert('Shuru aur khatam time ek jaisa hai');return}
const o={date:d,start:s,end:e,mins:m,amt:Math.round(m/60*RATE),note:$('en').value.trim()},f=F();
if(eid){Object.assign(f.entries.find(z=>z.id===eid),o)}else f.entries.push({id:uid(),...o});save();open_(cur)}
function addP(){const a=Math.round(+$('pm').value);if(!(a>0)){alert('Sahi rakam likhein');return}
F().pays.push({id:uid(),date:$('pd').value||today(),amt:a});save();open_(cur)}
function delE(id){if(!confirm('Yeh entry Delete karein?'))return;const f=F();f.entries=f.entries.filter(x=>x.id!==id);save();open_(cur)}
function delP(id){if(!confirm('Yeh wasooli Delete karein?'))return;const f=F();f.pays=f.pays.filter(x=>x.id!==id);save();open_(cur)}
function delF(){if(!confirm('Kisan aur uska saara hisab Delete ho jayega. Pakka?'))return;db.farmers=db.farmers.filter(x=>x.id!==cur);save();home()}
function editF(){const f=F();const n=prompt('Kisan ka naam',f.name);if(n===null)return;const p=prompt('Number',f.phone);if(p===null)return;const a=prompt('Rehaish',f.addr);if(a===null)return;
f.name=n.trim()||f.name;f.phone=p.trim();f.addr=a.trim();save();open_(cur)}
function stmt(f){const t=tot(f),E=[...f.entries].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),P=[...f.pays].sort((a,b)=>a.date.localeCompare(b.date));
let s='*Aslam Tubewell - Hisab*\nKisan: '+f.name+'\nTareekh: '+today()+'\n\n*Pani ki entries*\n';
s+=E.length?E.map((e,i)=>(i+1)+') '+e.date+' | '+t12(e.start)+' se '+t12(e.end)+' | '+dur(e.mins)+' | '+rs(e.amt)).join('\n'):'Koi entry nahi';
s+='\n\nTotal time: '+(dur(t.mn)||'0 min')+'\nTotal paisay: '+rs(t.bill)+' ('+rs(RATE)+' fi ghanta)\n\n*Wasooli (jama)*\n';
s+=P.length?P.map((p,i)=>(i+1)+') '+p.date+' | '+rs(p.amt)).join('\n'):'Abhi koi wasooli nahi';
return s+'\n\nTotal jama: '+rs(t.paid)+'\n*Baqaya: '+rs(t.due)+'*'}
function sendS(){$('sbox').innerHTML='<div class="card"><h2>Hisab ka message</h2><textarea id="stx" readonly rows="12" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit;font-size:13px"></textarea><div class="row" style="margin-top:10px"><button class="p" onclick="wa()">WhatsApp</button><button class="s" onclick="sh()">Share</button><button class="s" onclick="cp()">Copy</button></div></div>';$('stx').value=stmt(F());$('sbox').scrollIntoView({behavior:'smooth'})}
function wa(){const f=F();let n=(f.phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='92'+n.slice(1);window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('stx').value),'_blank')}
async function sh(){try{await navigator.share({text:$('stx').value})}catch(e){}}
function cp(){const x=$('stx');x.select();try{navigator.clipboard.writeText(x.value)}catch(e){document.execCommand('copy')}alert('Copy ho gaya')}
const fmtD=d=>d.split('-').reverse().join('-');
const rs0=n=>Math.round(n).toLocaleString('en-US')+' روپے';
const durU=m=>{const h=Math.floor(m/60),r=m%60;return[h?(h===1?'1 گھنٹہ':h+' گھنٹے'):'',r?r+' منٹ':''].filter(Boolean).join(' ')||'0 منٹ'};
const urT=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);const p=h<12?'صبح':h<16?'دوپہر':h<20?'شام':'رات';return (h%12||12)+':'+pad(m)+' '+p};
function mkImg(f){const t=tot(f),E=[...f.entries].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),P=[...f.pays].sort((a,b)=>a.date.localeCompare(b.date));
const W=1080,M=24,RH=72,nE=Math.max(E.length,1),nP=Math.max(P.length,1);
const H=380+70+(nE+2)*RH+40+70+(nP+2)*RH+40+270+90;
const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.direction='rtl';
const FF='"Geeza Pro","Noto Naskh Arabic","Noto Nastaliq Urdu",Arial,sans-serif';
const font=(sz,b)=>{x.font=(b?'bold ':'')+sz+'px '+FF};
