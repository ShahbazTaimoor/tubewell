function binRest(id){const b=BIN.find(x=>x.id===id);if(!b)return;
if(b.type==='tubewell'){const t=b.data.tw;if(!ST.tws.some(x=>x.id===t.id))ST.tws.splice(Math.min(Math.max(+b.data.idx||0,0),ST.tws.length),0,Object.assign({},t));
BIN.filter(x=>x.type==='kisan'&&x.twd===t.id).forEach(x=>{if(!db.farmers.some(f=>f.id===x.fid))db.farmers.push(x.data)});
BIN=BIN.filter(x=>x.id!==id&&x.twd!==t.id);saveST();twPush();saveBin();save();toast('Wapas aa gaya');setV();return}
if(b.type==='kisan'){if(db.farmers.some(f=>f.id===b.fid)){toast('Ye kisan pehle se maujood hai')}else{db.farmers.push(b.data);ensureFCodes()}}
else{const f=db.farmers.find(x=>x.id===b.fid);if(!f){alert('Pehle "'+b.fname+'" kisan ko wapas layein');return}(b.type==='entry'?f.entries:b.type==='purana'?(f.olds=f.olds||[]):f.pays).push(b.data)}
BIN=BIN.filter(x=>x.id!==id);saveBin();save();toast('Wapas aa gaya');setV()}
function binDel(id){const b=BIN.find(x=>x.id===id);if(!b||!confirm('Ye hamesha ke liye hat jayega, wapas nahi aayega. Pakka?'))return;const gs=b.type==='tubewell'?BIN.filter(x=>x.twd===b.fid):[];binPh(b);gs.forEach(binPh);BIN=BIN.filter(x=>x.id!==id&&!gs.includes(x));saveBin();setV()}
function binClear(){if(!BIN.length||!confirm('Deleted box ki saari cheezein hamesha ke liye hat jayengi. Pakka?'))return;BIN.forEach(binPh);BIN=[];saveBin();setV()}
