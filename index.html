<body><div class="app">
<header class="top"><svg class="wv" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30Q50 5 100 30T200 30T300 30T400 30V60H0Z"/></svg>
<div class="hr"><img class="lg" src="icon-192.png" alt=""><div class="hn"><h1 id="appn">Aslam Tubewell App</h1><div class="net" id="net"><i></i><span>Online</span></div></div></div>
<div class="cr"><div class="chip"><i></i><span id="sync">Check ho raha hai…</span></div><span class="rate" id="rt">Rs 500 fi ghanta</span></div></header>
<div id="v"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
let RATE=500;const KEY='aslam_tubewell_v1';
let db={farmers:[],ts:0},cur=null,dl=null,timer=null,U=null,FS=null,AU=null,lastP={},unsub=null;
try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r)}catch(e){}
function st(t){const s=document.getElementById('sync');if(s)s.textContent=t}
const wnum=p=>{let n=String(p||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='92'+n.slice(1);else if(n.length===10)n='92'+n;return n};
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,x=>x.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
if(/Android/i.test(navigator.userAgent))document.addEventListener('click',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&/^(date|time|month)$/.test(t.type)&&t.showPicker){try{t.showPicker()}catch(x){}}});
const sig=f=>JSON.stringify([f.name,f.phone,f.addr,f.dp,f.entries,f.pays,f.olds]);
function push(){if(!U||!FS)return;clearTimeout(timer);timer=setTimeout(async()=>{try{
const col=FS.collection('users').doc(U.uid).collection('farmers'),bt=FS.batch();let n=0;
db.farmers.forEach(f=>{const g=sig(f);if(lastP[f.id]!==g){f.ts=Date.now();bt.set(col.doc(f.id),{json:JSON.stringify(f),ts:f.ts});lastP[f.id]=g;n++}});
Object.keys(lastP).forEach(id=>{if(!db.farmers.some(f=>f.id===id)){bt.delete(col.doc(id));delete lastP[id];n++}});
if(n){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}await bt.commit()}
st('☁️ Online save ho gaya')}catch(e){st('⚠️ Online save nahi hua (phone mein save hai)')}},500)}
const save=()=>{db.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}push()};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs '+Math.round(n).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=m=>m<=0?'0 min':((m>=60?(Math.floor(m/60)===1?'1 ghanta':Math.floor(m/60)+' ghantay'):'')+(m>=60&&m%60?' ':'')+(m%60?m%60+' min':''));
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+a};
const mins=(s,e)=>{if(!s||!e)return 0;const a=s.split(':'),b=e.split(':');let m=(b[0]*60+ +b[1])-(a[0]*60+ +a[1]);if(m<0)m+=1440;return m};
const tot=f=>{const bill=f.entries.reduce((a,e)=>a+e.amt,0),old=(f.olds||[]).reduce((a,o)=>a+o.amt,0),paid=f.pays.reduce((a,p)=>a+p.amt,0),mn=f.entries.reduce((a,e)=>a+e.mins,0);return{bill,old,paid,mn,due:bill+old-paid}};
const dueP=t=>`<span class="pill ${t.due>0?'r':''}">${t.due>0?'Baqaya '+rs(t.due):t.due<0?'Ziada '+rs(-t.due):'Hisab saaf'}</span>`;

let hf='all';
function setHF(k){hf=k;home()}
function listH(q){q=(q||'').trim().toLowerCase();const a=db.farmers.filter(f=>(!q||(f.name+' '+f.phone+' '+f.addr).toLowerCase().includes(q))&&(hf==='all'||(hf==='due'?tot(f).due>0:tot(f).due<=0)));
return a.length?a.map(f=>{const t=tot(f);return`<button class="fm" onclick="open_('${f.id}')"><div style="display:flex;align-items:center;gap:12px;min-width:0">${av(f,46)}<div style="min-width:0"><b>${esc(f.name)}</b><small>${esc([f.phone,f.addr].filter(Boolean).join(' • ')||'—')} • ${dur(t.mn)||'0 min'}</small></div></div>${dueP(t)}</button>`}).join(''):'<div class="empty">'+(db.farmers.length?'Koi kisan nahi mila.':'Abhi koi kisan nahi. Upar se "Naya Kisan" dabayein.')+'</div>'}
function filt(){$('list').innerHTML=listH($('q').value)}
function home(){cur=null;view='home';navR();
const all=db.farmers.map(tot),bill=all.reduce((a,t)=>a+t.bill,0),paid=all.reduce((a,t)=>a+t.paid,0),old=all.reduce((a,t)=>a+t.old,0);
$('v').innerHTML=`<div class="card big"><span>Meri Total Kamai</span><strong>${rs(bill)}</strong>
<div class="grid" style="margin-top:12px;text-align:left"><div><span>Wasool hua</span><b>${rs(paid)}</b></div><div><span>Baqaya</span><b>${rs(bill+old-paid)}</b></div></div></div>
<button class="p" style="width:100%;margin-bottom:12px" onclick="$('addBox').classList.toggle('hide')">＋ Naya Kisan</button>
<div id="addBox" class="card hide"><h2>Naya Kisan</h2><div class="dpick" onclick="$('fdp').click()"><span id="dpv" class="av" style="width:76px;height:76px;background:var(--g2);color:var(--g);font-size:28px">📷</span><span class="mut sm">Kisan ki tasveer (DP, marzi)</span></div><input id="fdp" type="file" accept="image/*" class="hide" onchange="pickDP(this,1)">
<div class="f"><label>Kisan ka naam</label><input id="fn" placeholder="Naam"></div>
<div class="f"><label>Number</label><input id="fp" type="tel" placeholder="03xx-xxxxxxx"></div>
<div class="f"><label>Rehaish</label><input id="fa" placeholder="Gaon / ilaqa"></div><div class="f"><label>Purana baqaya (pichle saal ka, marzi)</label><input id="fo" type="number" inputmode="numeric" placeholder="Rs"></div>
<button class="p" style="width:100%" onclick="addF()">Save karein</button></div>
${db.farmers.length?'<input id="q" type="search" placeholder="🔍 Kisan ka naam dhoondein" oninput="filt()" style="margin-bottom:10px"><div class="chips">'+[['all','Sab'],['due','Baqaya wale'],['ok','Hisab saaf']].map(x=>'<button class="ch'+(hf===x[0]?' on':'')+'" onclick="setHF(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>':''}<div id="list">${listH('')}</div>
`}

function addF(){const n=$('fn').value.trim();if(!n){alert('Kisan ka naam likhein');return}
const ov=Math.round(+($('fo').value||0));db.farmers.push({id:uid(),name:n,phone:$('fp').value.trim(),addr:$('fa').value.trim(),entries:[],pays:[],dp:window._dp||'',olds:ov>0?[{id:uid(),date:(new Date().getFullYear()-1)+'-12-31',amt:ov,note:''}]:[]});window._dp='';save();home()}

let eid=null;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const AVC=['#0E6A99','#1F8266','#9A6A0E','#7A4DBF','#B4373F','#2D7D9A'];
function av(f,z){const st='width:'+z+'px;height:'+z+'px;font-size:'+Math.round(z*.42)+'px';if(f.dp)return'<img class="av" style="'+st+'" src="'+f.dp+'" alt="">';const n=(f.name||'?').trim();let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%6;return'<span class="av" style="'+st+';background:'+AVC[h]+'">'+esc(n.charAt(0).toUpperCase())+'</span>'}
function dpCut(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const n=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,160,160);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function pickDP(el,nw){const fl=el.files[0];if(!fl)return;try{const d=await dpCut(fl);if(nw){window._dp=d;$('dpv').outerHTML='<img id="dpv" class="av" style="width:76px;height:76px" src="'+d+'" alt="">'}else{F().dp=d;save();open_(cur)}}catch(e){alert('Tasveer nahi khuli')}el.value=''}
function delDP(){delete F().dp;save();open_(cur)}
const dbx=d=>{const[y,m,dd]=d.split('-');return`<div class="db"><b>${+dd}</b><span>${MN[m-1]}</span><span>${y}</span></div>`};
function tlH(L,f){if(!L.length)return'<div class="empty">Abhi koi entry nahi.</div>';let cm='',h='';
L.forEach(r=>{const o=r.o,p=r.k==='p',od=r.k==='o',mk=o.date.slice(0,7);
if(mk!==cm){cm=mk;h+=`<div class="tm"><span>${MN[+mk.slice(5)-1]} ${mk.slice(0,4)}</span></div>`}
const d=+o.date.slice(8),mo=MN[+o.date.slice(5,7)-1];
h+=`<div class="tl"><div class="td"><b>${d}</b><span>${mo}</span></div><div class="tx"><i class="${p?'pd':od?'od':''}"></i><u></u></div><div class="tc${p?' pc':od?' oc':''}"><div class="h2d"><b>${p?'Wasooli':od?'📜 Purana baqaya':t12(o.start)+' → '+t12(o.end)}</b><b class="${p?'pos':''}">${p?'− ':''}${rs(o.amt)}</b></div><div class="h2d sm mut"><span>${p?esc(o.how||'Cash'):od?esc(o.note||'Pichle saal ka baqaya'):dur(o.mins)+(o.note?' • '+esc(o.note):'')}</span><span class="${r.run>0?'neg':''}">Baqaya ${rs(r.run)}</span></div>${p&&o.img?'<img class="ph" data-pid="'+o.img+'" onclick="viewPh(this)">':''}<div class="ac"><button class="s mini" onclick="${p?`editP('${o.id}')`:od?`editO('${o.id}')`:`open_('${f.id}','${o.id}');window.scrollTo(0,0)`}">✎ Edit</button><button class="d mini" onclick="${p?'delP':od?'delO':'delE'}('${o.id}')">🗑 Delete</button></div></div></div>`});return h}
function open_(id,ed){cur=id;eid=ed||null;view='home';navR();pushS('k');const f=db.farmers.find(x=>x.id===id);if(!f)return home();const t=tot(f),E=eid?f.entries.find(x=>x.id===eid):null;
const tb=t.bill+t.old,pct=tb>0?Math.min(100,Math.round(t.paid/tb*100)):0;
const L=[...f.entries.map(o=>({k:'e',d:o.date,s:o.start,o})),...f.pays.map(o=>({k:'p',d:o.date,s:'99',o})),...(f.olds||[]).map(o=>({k:'o',d:o.date,s:'00',o}))].sort((a,b)=>(a.d+a.s).localeCompare(b.d+b.s));
let run=0;L.forEach(r=>{run+=(r.k==='p'?-1:1)*r.o.amt;r.run=run});
$('v').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="s" onclick="back_()">← Wapas</button><button class="s" onclick="editF()">✎ Kisan edit</button></div>
<div class="card pc2"><div class="ph2"><div class="avw" onclick="$('edp').click()">${av(f,76)}<i>📷</i></div><input id="edp" type="file" accept="image/*" class="hide" onchange="pickDP(this)"><div style="min-width:0"><h2 style="margin:0;font-size:20px">${esc(f.name)}</h2><div class="mut" style="margin-top:6px">🏠 ${esc(f.addr||'—')}</div><div class="mut" style="margin-top:4px">📞 ${esc(f.phone||'Number nahi likha')}</div>${f.dp?'<button class="d mini" style="margin-top:6px" onclick="delDP()">DP hatayein</button>':''}</div></div>${f.phone?`<div class="row" style="margin-top:12px"><a class="cb c" href="tel:${f.phone.replace(/[^\d+]/g,'')}"><i class="ci">${IC.ph}</i><b>Call karein</b>${IC.ar}</a><a class="cb w" target="_blank" rel="noopener" href="https://wa.me/${wnum(f.phone)}"><i class="ci">${IC.ph}</i><b>WhatsApp</b>${IC.ar}</a></div>`:''}</div>
<div class="card"><h2>💧 Is kisan ka poora hisab</h2><div class="stg">
<div class="stt"><i class="ci">${IC.clk}</i><div><span>Total time</span><b>${dur(t.mn)||'0 min'}</b></div></div><div class="stt gn"><i class="ci">${IC.coin}</i><div><span>Total paisay</span><b>${rs(t.bill)}</b></div></div>
<div class="stt"><i class="ci">${IC.scr}</i><div><span>Purana baqaya</span><b>${rs(t.old)}</b></div></div><div class="stt"><i class="ci">${IC.ok}</i><div><span>Wasool hua</span><b class="pos">${rs(t.paid)}</b></div></div>
<div class="stt rd"><i class="ci">${IC.coin}</i><div><span>Baqaya (kul)</span><b style="font-size:20px;color:${t.due>0?'var(--red)':'var(--g)'}">${rs(t.due)}</b></div></div></div>
<div class="bar"><i style="width:${pct}%"></i></div><div class="mut sm">${pct}% wasool • ${f.entries.length} entries</div></div>
<div class="row" style="margin-bottom:12px"><button class="p" onclick="sheet()">🖼 Hisab ki tasveer</button><button class="s" onclick="sendS()">📝 Message</button></div><div id="sbox"></div>
<div class="card fc" id="fm"><div class="fh" data-d="🚰"><i class="ic">💧</i><div><h2>${E?'✎ Entry edit karein':'Pani ki nayi entry'}</h2><small>Apna pani ka bill yahan enter karein</small></div></div><div class="fb">
<div class="f"><label>Date</label><div class="fi">${IC.cal}<input id="ed" type="date" value="${E?E.date:today()}"></div></div>
<div class="row"><div class="f"><label>Pani shuru (time)</label><div class="fi">${IC.clk}<input id="es" type="time" value="${E?E.start:''}" oninput="pv()"></div><button class="s mini" onclick="$('es').value=nowT();pv()">Abhi</button></div>
<div class="f"><label>Pani khatam (time)</label><div class="fi">${IC.clk}<input id="ee" type="time" value="${E?E.end:''}" oninput="pv()"></div><button class="s mini" onclick="$('ee').value=nowT();pv()">Abhi</button></div></div>
<div class="f"><label>Rate</label><div><span class="rate">Rs ${RATE} fi ghanta</span></div></div><div class="prev"><span>Total time: <span id="pt">—</span></span><span id="pa">Rs 0</span></div>
<div class="f"><label>Note (marzi)</label><div class="fi">${IC.pen}<input id="en" placeholder="Jaise: gandum ka pani" value="${esc(E?E.note:'')}"></div></div>
<button class="sb" onclick="addE()">${IC.sv}<span>${E?'Tabdeeli save karein':'Entry save karein'}</span></button>${E?'<button class="s" style="width:100%;margin-top:8px" onclick="open_(cur)">Cancel</button>':''}</div></div>
<div class="card fc gd"><div class="fh" data-d="📜"><i class="ic">📜</i><div><h2>Purana Baqaya</h2><small>Pichle saal ka baqaya jo is kisan se lena hai, yahan likhein. Ye kul baqaya mein jud jayega.</small></div></div><div class="fb">
<div class="row"><div class="f"><label>Rakam</label><div class="fi">${IC.coin}<input id="orm" type="number" inputmode="numeric" placeholder="Rs"></div></div><div class="f"><label>Date</label><div class="fi">${IC.cal}<input id="od" type="date" value="${new Date().getFullYear()-1}-12-31"></div></div></div>
<div class="f"><label>Note (marzi)</label><div class="fi">${IC.pen}<input id="on" placeholder="Jaise: 2025 ka baqaya"></div></div><button class="sb" onclick="addO()">${IC.sv}<span>Purana baqaya add karein</span></button></div></div>
<div class="card fc gr"><div class="fh" data-d="💵"><i class="ic">💰</i><div><h2>Paisay wasool kiye</h2></div></div><div class="fb">
<div class="row"><div class="f"><label>Rakam</label><div class="fi">${IC.coin}<input id="pm" type="number" inputmode="numeric" placeholder="Rs"></div></div><div class="f"><label>Date</label><div class="fi">${IC.cal}<input id="pd" type="date" value="${today()}"></div></div></div>
<div class="f"><label>Tareeqa (kaise diye)</label><div class="fi">${IC.wal}<select id="ph"><option value="Cash">Cash</option><option value="JazzCash">JazzCash</option><option value="Easypaisa">Easypaisa</option><option value="Bank">Bank</option><option value="Aur">Aur</option></select></div></div><div class="f"><label>Saboot ki tasveer (marzi)</label><div class="fi">${IC.clip}<input id="pimg" type="file" accept="image/*"></div></div><button class="sb" onclick="addP()">${IC.sv}<span>Wasooli save karein</span></button></div></div>
<div class="card"><div class="h2d" style="margin-bottom:10px"><h2 style="margin:0">📒 Poori kitab (${L.length})</h2><button class="s mini" onclick="$('tlend').scrollIntoView({behavior:'smooth',block:'center'})">⬇ Naye tak</button></div>${tlH(L,f)}<div id="tlend"></div></div>
<button class="d" style="width:100%" onclick="delF()">🗑 Yeh Kisan Delete karein</button>`;loadPh();if(E)pv()}

function pv(){const m=mins($('es').value,$('ee').value);$('pt').textContent=m?dur(m):'—';$('pa').textContent=rs(m/60*RATE)}
const F=()=>db.farmers.find(x=>x.id===cur);
function addE(){const s=$('es').value,e=$('ee').value,d=$('ed').value;if(!d||!s||!e){alert('Date, shuru aur khatam time likhein');return}
const m=mins(s,e);if(!m){alert('Shuru aur khatam time ek jaisa hai');return}
const o={date:d,start:s,end:e,mins:m,amt:Math.round(m/60*RATE),note:$('en').value.trim()},f=F();
const ex=eid&&f.entries.find(z=>z.id===eid);if(ex)Object.assign(ex,o);else f.entries.push({id:uid(),...o});save();ding();open_(cur)}
async function addP(){const a=Math.round(+$('pm').value);if(!(a>0)){alert('Sahi rakam likhein');return}
const o={id:uid(),date:$('pd').value||today(),amt:a,how:$('ph').value},fl=$('pimg').files[0];
if(fl){try{const d=await compress(fl);o.img=o.id;await phPut(o.id,d);if(U&&FS)FS.collection('users').doc(U.uid).collection('photos').doc(o.id).set({d}).catch(()=>{})}catch(e){alert('Tasveer save nahi hui')}}
F().pays.push(o);save();ding();open_(cur)}
function delE(id){if(!confirm('Yeh entry Delete karein?\n(Deleted Box mein 30 din rahegi, wahan se wapas la sakte hain)'))return;const f=F(),e=f.entries.find(x=>x.id===id);
if(e){BIN.unshift({id:uid(),type:'entry',fid:f.id,fname:f.name,data:e,del:Date.now()});saveBin()}f.entries=f.entries.filter(x=>x.id!==id);save();open_(cur)}
function delP(id){if(!confirm('Yeh wasooli Delete karein?\n(Deleted Box mein 30 din rahegi, wahan se wapas la sakte hain)'))return;const f=F(),p=f.pays.find(x=>x.id===id);
if(p){BIN.unshift({id:uid(),type:'wasooli',fid:f.id,fname:f.name,data:p,del:Date.now()});saveBin()}f.pays=f.pays.filter(x=>x.id!==id);save();open_(cur)}
function delF(){if(!confirm('Yeh kisan aur uska saara hisab Delete ho jayega.\n(Deleted Box mein 30 din rahega, wahan se wapas la sakte hain). Pakka?'))return;const f=F();
BIN.unshift({id:uid(),type:'kisan',fid:f.id,fname:f.name,data:f,del:Date.now()});saveBin();db.farmers=db.farmers.filter(x=>x.id!==cur);save();home()}
function addO(){const a=Math.round(+$('orm').value);if(!(a>0)){alert('Sahi rakam likhein');return}const f=F();(f.olds=f.olds||[]).push({id:uid(),date:$('od').value||today(),amt:a,note:$('on').value.trim()});save();ding();open_(cur)}
function delO(id){if(!confirm('Yeh purana baqaya Delete karein?\n(Deleted Box mein 30 din rahega, wahan se wapas la sakte hain)'))return;const f=F(),p=(f.olds||[]).find(x=>x.id===id);if(p){BIN.unshift({id:uid(),type:'purana',fid:f.id,fname:f.name,data:p,del:Date.now()});saveBin()}f.olds=(f.olds||[]).filter(x=>x.id!==id);save();open_(cur)}
function modal(h,c){const o=document.createElement('div');o.className='ov';o.id='em';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML='<div class="sh fc '+(c||'')+'" style="border-radius:24px 24px 0 0">'+h+'</div>';document.body.appendChild(o)}
const mcx=(id,t)=>'<button class="s" style="width:100%;margin-top:8px" onclick="$(\'em\').remove()">Cancel</button>';

async function tryPin(){const v=$('lkp').value;if(await hx(v)===ST.pin)unlock();else{$('lkm').textContent='PIN galat hai';$('lkp').value=''}}
function unlock(){const o=$('lk');locked=false;if(o){o.classList.add('out');setTimeout(()=>o.remove(),300)}}
async function forgotPin(){if(!U||!AU){alert('Is ke liye online login chahiye');return}const p=prompt('Apne account ka password likhein ('+U.email+')');if(!p)return;try{await AU.signInWithEmailAndPassword(U.email,p);unlock()}catch(e){$('lkm').textContent='Password galat hai'}}

function idb(){return new Promise((r,j)=>{const q=indexedDB.open('aslam_ph',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
async function phPut(id,d){const x=await idb();return new Promise(r=>{const t=x.transaction('p','readwrite');t.objectStore('p').put(d,id);t.oncomplete=()=>r()})}
async function phGet(id){try{const x=await idb();return await new Promise(r=>{const q=x.transaction('p').objectStore('p').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function phDel(id){try{const x=await idb();return new Promise(r=>{const t=x.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>r()})}catch(e){}}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function loadPh(){for(const im of document.querySelectorAll('img[data-pid]')){const id=im.dataset.pid;let d=await phGet(id);if(!d&&U&&FS){try{const sn=await FS.collection('users').doc(U.uid).collection('photos').doc(id).get();if(sn.exists){d=sn.data().d;phPut(id,d)}}catch(e){}}if(d)im.src=d}}
function viewPh(im){if(!im.src)return;const o=document.createElement('div');o.className='ov';o.style.cssText='align-items:center;background:rgba(0,0,0,.9);z-index:35';o.onclick=()=>o.remove();o.innerHTML='<img src="'+im.src+'" style="max-width:100%;max-height:90%;border-radius:10px">';document.body.appendChild(o)}
let BIN=[],lastB={},binOpen=false;
function binT(){binOpen=!binOpen;$('binb').classList.toggle('hide',!binOpen);$('binc').textContent=binOpen?'▴':'▾'}try{BIN=JSON.parse(localStorage.getItem('aslam_bin')||'[]')}catch(e){}
const saveBin=()=>{try{localStorage.setItem('aslam_bin',JSON.stringify(BIN))}catch(e){}pushBin()};
function pushBin(){if(!U||!FS)return;const col=FS.collection('users').doc(U.uid).collection('bin'),bt=FS.batch();let n=0;
BIN.forEach(b=>{if(!lastB[b.id]){bt.set(col.doc(b.id),{json:JSON.stringify(b)});lastB[b.id]=1;n++}});
Object.keys(lastB).forEach(id=>{if(!BIN.some(b=>b.id===id)){bt.delete(col.doc(id));delete lastB[id];n++}});
if(n)bt.commit().catch(()=>{})}
function listenBin(){FS.collection('users').doc(U.uid).collection('bin').onSnapshot(sn=>{let ch=false;
sn.docChanges().forEach(c=>{const id=c.doc.id;if(c.type==='removed'){if(BIN.some(b=>b.id===id)){BIN=BIN.filter(b=>b.id!==id);ch=true}delete lastB[id];return}
if(!BIN.some(b=>b.id===id)){try{BIN.push(JSON.parse(c.doc.data().json));ch=true}catch(e){return}}lastB[id]=1});
if(ch){try{localStorage.setItem('aslam_bin',JSON.stringify(BIN))}catch(e){}if(view==='set')setV()}})}
function binPh(b){const ps=b.type==='kisan'?b.data.pays:b.type==='wasooli'?[b.data]:[];ps.forEach(p=>{if(p.img){phDel(p.img);if(U&&FS)FS.collection('users').doc(U.uid).collection('photos').doc(p.img).delete().catch(()=>{})}})}
function purgeBin(){const old=BIN.filter(b=>Date.now()-b.del>30*864e5);if(old.length){old.forEach(binPh);BIN=BIN.filter(b=>!old.includes(b));saveBin()}}
function binH(){const it=BIN.slice().sort((a,b)=>b.del-a.del);
return`<div class="card"><div class="h2d" style="cursor:pointer" onclick="binT()"><h2 style="margin:0">🗑 Deleted Box (${it.length})</h2><span id="binc" class="mut" style="font-size:20px">${binOpen?'▴':'▾'}</span></div><div id="binb" class="${binOpen?'':'hide'}" style="margin-top:10px"><div class="mut sm" style="margin-bottom:10px">Delete ki hui cheezein yahan 30 din tak rehti hain. Wapas lane par wo pehle ki tarah ho jati hain.</div>`+
(it.length?it.map(b=>{const d=b.data,left=Math.max(0,30-Math.floor((Date.now()-b.del)/864e5));
const ti=b.type==='kisan'?'👤 Kisan':b.type==='entry'?'💧 Entry':b.type==='purana'?'📜 Purana baqaya':'💰 Wasooli';
const inf=b.type==='kisan'?`${d.entries.length} entries • ${d.pays.length} wasooli`:b.type==='entry'?`${fmtD(d.date)} • ${t12(d.start)} → ${t12(d.end)} • ${rs(d.amt)}`:`${fmtD(d.date)} • ${rs(d.amt)}`;
return`<div class="bi"><div class="h2d"><b>${ti}: ${esc(b.type==='kisan'?d.name:b.fname)}</b><span class="pill${left<4?' r':''}">${left} din baqi</span></div><div class="mut sm" style="margin:4px 0 8px">${inf}<br>Delete hua: ${(d=>pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear())(new Date(b.del))}</div><div class="row"><button class="s mini" onclick="binRest('${b.id}')">↩ Wapas layein</button><button class="d mini" onclick="binDel('${b.id}')">❌ Hamesha ke liye</button></div></div>`}).join('')+'<button class="d" style="width:100%;margin-top:6px" onclick="binClear()">Poora box khali karein</button>':'<div class="empty">Deleted box khali hai.</div>')+'</div></div>'}
function binRest(id){const b=BIN.find(x=>x.id===id);if(!b)return;
if(b.type==='kisan'){if(db.farmers.some(f=>f.id===b.fid)){toast('Ye kisan pehle se maujood hai')}else db.farmers.push(b.data)}
else{const f=db.farmers.find(x=>x.id===b.fid);if(!f){alert('Pehle "'+b.fname+'" kisan ko wapas layein');return}(b.type==='entry'?f.entries:b.type==='purana'?(f.olds=f.olds||[]):f.pays).push(b.data)}
BIN=BIN.filter(x=>x.id!==id);saveBin();save();toast('Wapas aa gaya');setV()}
function binDel(id){const b=BIN.find(x=>x.id===id);if(!b||!confirm('Ye hamesha ke liye hat jayega, wapas nahi aayega. Pakka?'))return;binPh(b);BIN=BIN.filter(x=>x.id!==id);saveBin();setV()}
function binClear(){if(!BIN.length||!confirm('Deleted box ki saari cheezein hamesha ke liye hat jayengi. Pakka?'))return;BIN.forEach(binPh);BIN=[];saveBin();setV()}
function logoCut(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const n=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=192;c.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,192,192);res(c.toDataURL('image/png'))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

const TN=new WeakMap();
function trNode(n){if(n.nodeType===3){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest('.nt')))return;const v=n.nodeValue,i=TN.get(n);if(i&&v===i.t)return;const t=trT(v);TN.set(n,{o:v,t});if(t!==v)n.nodeValue=t}
else if(n.nodeType===1){if(/^(SCRIPT|STYLE)$/.test(n.nodeName))return;if(n.hasAttribute('placeholder')){n._po=n._po||n.getAttribute('placeholder');n.setAttribute('placeholder',trT(n._po))}n.childNodes.forEach(trNode)}}
function relang(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)||n.parentNode.closest('.nt'))continue;const i=TN.get(n),o=i&&n.nodeValue===i.t?i.o:n.nodeValue,t=trT(o);TN.set(n,{o,t});if(n.nodeValue!==t)n.nodeValue=t}
document.querySelectorAll('[placeholder]').forEach(e=>{e._po=e._po||e.getAttribute('placeholder');e.setAttribute('placeholder',trT(e._po))})}

function startLang(){applyDir();new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(trNode);if(m.type==='characterData')trNode(m.target)})).observe(document.body,{childList:true,subtree:true,characterData:true});relang()}
