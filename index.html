<!doctype html>
<html translate="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="google" content="notranslate"><!-- Chrome ka Translate popup band (v72) -->
<meta name="apple-mobile-web-app-title" content="ٹیوب ویل کھاتہ"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" id="ati" href="icon-180.png"><link rel="icon" id="fav" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B3C6B">
<title>ٹیوب ویل کھاتہ</title>
<style>
:root{--fs:1;--rb:#DCF8E9;--rc:#0A6B3C;--h1:#0B3C6B;--h2:#1580B8;--pt:#fff;--g:#0E6A99;--g2:#E1F1FA;--ink:#12283D;--mut:#5F7487;--line:#D9E6EF;--bg:#F2F7FB;--card:#fff;--red:#B4373F;--redbg:#FDEBEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4FB3E8;--g2:#16303F;--ink:#E4EFF7;--mut:#8FA6B8;--line:#25404F;--bg:#0E1A24;--card:#14232F;--red:#ff8a8a;--redbg:#3A2124}}
:root[data-theme="dark"]{--g:#4FB3E8;--g2:#16303F;--ink:#E4EFF7;--mut:#8FA6B8;--line:#25404F;--bg:#0E1A24;--card:#14232F;--red:#ff8a8a;--redbg:#3A2124}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,"Segoe UI",Arial,sans-serif;font-size:calc(15px*var(--fs))}
.app{max-width:640px;margin:auto;padding:0 14px 120px}
.top{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:22px 16px;border-radius:0 0 22px 22px;margin:0 -14px 14px}
.top h1{margin:0;font-size:calc(23px*var(--fs))}.top small{opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:700}
.p{background:linear-gradient(180deg,#1B8CC4,#0E6A99);color:var(--pt);box-shadow:0 1px 0 rgba(255,255,255,.42) inset,0 -3px 0 rgba(7,52,77,.32) inset,0 10px 22px rgba(14,106,153,.38)}.s{background:linear-gradient(180deg,var(--card),var(--g2));color:var(--g);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 4px 10px rgba(11,60,107,.10)}.d{background:var(--redbg);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 5px rgba(11,60,107,.05),0 12px 26px rgba(11,60,107,.10)}
.big{text-align:center;padding:18px;position:relative}.big span{font-size:calc(13px*var(--fs));color:var(--mut)}.big strong{display:block;font-size:calc(34px*var(--fs));margin-top:4px;color:var(--g)}
@supports((-webkit-background-clip:text) or (background-clip:text)){.big strong{background:linear-gradient(180deg,var(--h2),var(--h1));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}}
.eyebtn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:calc(17px*var(--fs));line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px rgba(11,60,107,.08)}
.grid span{display:block;font-size:calc(11px*var(--fs));color:var(--mut);margin-bottom:3px}.grid b{font-size:calc(15px*var(--fs))}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.f label{font-size:calc(13px*var(--fs));font-weight:700;color:var(--mut)}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.fm{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:14px;margin-bottom:9px;border-radius:15px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 4px 10px rgba(11,60,107,.07),0 10px 22px rgba(11,60,107,.08)}
.fm small{display:block;color:var(--mut);font-weight:400;margin-top:3px}
.pill{font-size:calc(12px*var(--fs));padding:5px 9px;border-radius:99px;background:var(--g2);color:var(--g);white-space:nowrap}.pill.r{background:var(--redbg);color:var(--red)}
h2{font-size:calc(17px*var(--fs));margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:calc(12px*var(--fs))}
.prev{background:var(--g2);color:var(--g);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;font-weight:700}
.ent{border-top:1px solid var(--line);padding:11px 0}.ent:first-of-type{border:0}
.ent .h{display:flex;justify-content:space-between;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:18px}
.hide{display:none!important}
.mini{padding:6px 10px;font-size:calc(12px*var(--fs))}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.f{min-width:0}
.bar{height:10px;background:var(--g2);border-radius:99px;overflow:hidden;margin:12px 0 6px;box-shadow:inset 0 1px 3px rgba(11,60,107,.18)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--h2),var(--h1));border-radius:99px;box-shadow:0 0 6px rgba(20,60,100,.22)}
.it{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}.it:first-of-type{border:0}
.db{min-width:56px;text-align:center;background:var(--g2);color:var(--g);border-radius:12px;padding:7px 4px}.db b{display:block;font-size:calc(21px*var(--fs));line-height:1.1}.db span{display:block;font-size:calc(10px*var(--fs))}
.it.pay .db{background:#fff4d6;color:#8a6200}
.im{flex:1;min-width:0}.im b{font-size:calc(14px*var(--fs))}.im small{display:block;color:var(--mut);margin-top:3px}
.ac{display:flex;gap:6px;margin-top:8px}.ia{text-align:right;white-space:nowrap}.ia b{display:block;font-size:calc(15px*var(--fs))}.ia small{display:block;font-size:calc(11px*var(--fs));color:var(--mut);margin-top:3px}
.pos{color:var(--g)}.neg{color:var(--red)}
.call{background:var(--g);color:var(--pt);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:12px;white-space:nowrap}
.top{position:relative}.th{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.2);color:#fff;padding:8px 12px;font-size:calc(13px*var(--fs))}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);color:var(--ink);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.to{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;margin-bottom:8px;padding:12px}.to.on{border-color:var(--g)}.to b{flex:1}
.sw{width:58px;height:40px;border-radius:10px;position:relative;display:block;overflow:hidden}.sw i{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%}.sw i:first-child{left:8px}.sw i:last-child{left:30px}
select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit}
.rate{background:var(--rb);color:var(--rc);padding:2px 9px;border-radius:8px;font-weight:800;white-space:nowrap}
/* v1.3.28: entry form rate EDIT box — halke rang ka pyara box */
.rrate{display:flex;align-items:center;gap:9px;background:var(--g2);border:1px solid var(--line);border-radius:16px;padding:6px 12px}
.rrate svg{width:22px;height:22px;color:var(--g);flex:none;position:static;transform:none}
.rrate .rpre{flex:none;font-weight:800;color:var(--mut);font-size:calc(12.5px*var(--fs))}
.rrate input{flex:1;min-width:0;width:100%;min-height:44px;border:none;background:transparent;padding:0 4px;border-radius:0;font-weight:800;font-size:calc(19px*var(--fs));color:var(--ink);text-align:center;letter-spacing:.5px}
.rrate input:focus{outline:none;box-shadow:none}
.rrate .runit{flex:none;background:var(--rb);color:var(--rc);border-radius:99px;padding:6px 13px;font-size:calc(11.5px*var(--fs));font-weight:800;white-space:nowrap}
.rhint{display:none;margin-top:7px;font-size:calc(11px*var(--fs));font-weight:700;color:var(--g);background:var(--g2);border:1px dashed var(--g);border-radius:10px;padding:5px 11px;line-height:1.9}
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none}
#v{padding-bottom:104px}
.nav>div{pointer-events:auto;background:rgba(255,255,255,.88);border:1px solid rgba(201,226,245,.95);border-radius:99px;padding:8px;display:flex;gap:6px;box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 14px 34px rgba(11,60,107,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nb{background:transparent;color:var(--mut);border-radius:99px;width:52px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.nb.on{background:var(--g);color:var(--pt);width:auto;padding:0 18px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -2px 0 rgba(7,52,77,.3) inset,0 6px 14px rgba(14,106,153,.4)}.nb svg{width:22px;height:22px}
html[data-th=raat] .nav>div{background:rgba(42,51,56,.94);border-color:rgba(242,181,68,.22);box-shadow:0 10px 28px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.35)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav>div{background:#F4F9FD}html[data-th=raat] .nav>div{background:#2A3338}}
.h2d{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph{display:block;width:64px;height:64px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:40;font-size:calc(14px*var(--fs))}
.call{display:flex;align-items:center;justify-content:center;gap:8px}.wa{background:#1FAF55;color:#fff}
html,body{touch-action:pan-x pan-y}input,select,textarea{font-size:16px}
/* v1.3.9+11: Poori kitab — compact rows + mahine ke totals + tap Edit/Delete; v11: har entry rangi box (weB/weG/weA vars — 1.3.10 jaisa) */
.tlM{display:flex;align-items:center;gap:10px;margin:16px 2px 8px}
.tlM b{font-size:calc(13.5px*var(--fs));font-weight:800;color:var(--ink);white-space:nowrap}
.tlM::after{content:'';flex:1;height:1px;background:var(--line)}
.tlMT{display:flex;gap:10px;white-space:nowrap}
.tlMT i{font-style:normal;font-weight:700;font-size:calc(10.5px*var(--fs));color:var(--mut)}
.tlR{display:flex;gap:10px;margin-bottom:8px}
.tlD{width:44px;flex:none;text-align:center;padding-top:9px}
.tlD b{display:block;font-size:calc(16px*var(--fs));font-weight:800;line-height:1.25;color:var(--wtx,var(--ink))}
.tlD span{display:block;font-size:calc(9.5px*var(--fs));color:var(--mut);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.tlD.tlDs{visibility:hidden}
.tlC{position:relative;flex:1;min-width:0;background:var(--wbg,var(--card));border:1px solid var(--wbr,var(--line));border-inline-start:4px solid var(--wsp,#2D7D9A);border-radius:13px;padding:9px 10px;padding-inline-end:34px;box-shadow:0 1px 2px rgba(15,45,80,.06);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s ease}
.tlC:active{transform:scale(.992)}
.tlC:focus{outline:none}
.tlC.on{border-color:var(--wsp,var(--g));box-shadow:0 5px 16px rgba(14,106,153,.15)}
.tlr2{display:flex;align-items:center;gap:8px}
.tlI{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--fs));background:var(--wbr,rgba(45,125,154,.13))}
.tlT{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tlT>b{font-size:calc(13px*var(--fs));font-weight:800;line-height:1.35;color:var(--ink)}
.tlS{font-size:calc(11px*var(--fs));color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tlChip{background:var(--card);border:1px solid var(--wbr,rgba(45,125,154,.33));color:var(--wtx,var(--g));border-radius:99px;padding:.5px 8px;font-weight:800;font-size:calc(10px*var(--fs));white-space:nowrap}
.tlNote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tlA{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tlAmt{font-size:calc(14px*var(--fs));font-weight:800;color:var(--wtx,var(--ink));white-space:nowrap;line-height:1.25}
.tlAmt.pos{color:var(--wtx,#1FAF55)}
.tlBal{font-size:calc(10px*var(--fs));color:var(--mut);font-weight:700;white-space:nowrap}
.tlBal.neg{color:var(--red);font-weight:800}
.tlX{position:absolute;top:50%;inset-inline-end:6px;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5px;cursor:pointer;padding:0}
.tlX i{width:3.5px;height:3.5px;border-radius:50%;background:var(--mut);transition:background .15s}
.tlC.on .tlX i{background:var(--g)}
.tlC .ac{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.tlC.on .ac{display:flex;animation:tlacc .18s ease both}
@keyframes tlacc{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
html[lang=ur] .tlT>b{line-height:2.05;white-space:normal;overflow:visible;text-overflow:clip}
html[lang=ur] .tlChip{line-height:1.9;padding-top:0;padding-bottom:0}
html[lang=ur] .tlD span{font-size:calc(10.5px*var(--fs));letter-spacing:0;line-height:1.9}
html[lang=ur] .tlM b{line-height:1.9}
html[data-th=raat] .tlC,:root:not([data-theme="light"]) .tlC{box-shadow:none}
/* v1.3.17: notification FULL-SCREEN gate (farmer) — jab tak ON na dabaye khata nazar nahi aata */
#ntgate{position:fixed;inset:0;z-index:26;background:linear-gradient(160deg,#0B3C6B,#1478b0);display:flex;align-items:center;justify-content:center;padding:22px 18px;overflow-y:auto;animation:fade .3s ease;direction:ltr}
html[data-th=indigo] #ntgate{background:linear-gradient(160deg,#202B68,#3949AB)}
#ntgate .ngc{width:100%;max-width:350px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:9px}
#ntgate .ngur{font-family:var(--uf),system-ui,sans-serif}
#ntgate .ngur .ngt{line-height:2}#ntgate .ngur .ngx{line-height:2.3}#ntgate .ngur .ngf{line-height:2.1}#ntgate .ngur .ngwarn{line-height:2.5}
#ntgate .ngic{width:62px;height:62px;border-radius:15px;box-shadow:0 8px 22px rgba(0,0,0,.35);animation:spicon .75s cubic-bezier(.2,.9,.3,1.35) both}
#ntgate .ngbell{font-size:42px;line-height:1.15;animation:spup .6s .12s cubic-bezier(.2,.9,.3,1) both}
#ntgate .ngt{margin:2px 0 0;font-size:calc(19px*var(--fs));font-weight:800;line-height:1.6}
#ntgate .ngx{margin:0;font-size:calc(14px*var(--fs));line-height:1.95;color:rgba(255,255,255,.94)}
#ntgate .ngb{margin-top:9px;width:100%;border:0;border-radius:14px;padding:13px 10px;font-size:calc(16px*var(--fs));font-weight:800;color:#0B3C6B;background:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);font-family:inherit;animation:spup .6s .26s cubic-bezier(.2,.9,.3,1) both}
#ntgate .ngb:active{transform:scale(.97)}
#ntgate .ngf{margin:3px 0 0;font-size:calc(11.5px*var(--fs));line-height:1.85;color:rgba(255,255,255,.78)}
#ntgate .ngwarn{width:100%;box-sizing:border-box;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.32);border-radius:12px;padding:10px 12px;font-size:calc(12.5px*var(--fs));line-height:2.1;text-align:start}
#ntgate .ngl{margin-top:3px;border:0;background:none;color:rgba(255,255,255,.88);font-size:calc(13px*var(--fs));text-decoration:underline;cursor:pointer;font-family:inherit;padding:8px 6px}
@media(prefers-reduced-motion:reduce){#ntgate .ngic,#ntgate .ngbell,#ntgate .ngb{animation-duration:.01s;animation-delay:0s}}
.bi{border-top:1px solid var(--line);padding:12px 0}
/* v1.1.0: kisan link request intezar card — bhejne ke foran baad badi animated waiting card */
.fwait{text-align:center;background:var(--card);border:1.5px dashed var(--g);border-radius:16px;padding:16px 14px 14px;margin:2px 0 12px;box-shadow:0 6px 18px rgba(11,60,107,.08)}
.fwring{position:relative;width:72px;height:72px;margin:2px auto 10px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center}
.fwring::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--g);animation:nbr 1.6s ease-out infinite}
.fwi{font-size:calc(32px*var(--fs));line-height:1;animation:fwob 1.5s ease-in-out infinite}
.fwt{display:block;font-size:calc(15.5px*var(--fs));margin-bottom:5px}
.fws{color:var(--mut);font-size:calc(12.5px*var(--fs));line-height:1.65;margin-bottom:9px}
.fwcode{display:inline-block;background:var(--g2);color:var(--g);font-weight:800;padding:4px 14px;border-radius:99px;margin-bottom:7px}
.fwmeta{font-size:calc(11.5px*var(--fs));color:var(--mut);margin-bottom:2px}
.fwdots{font-size:calc(12.5px*var(--fs));color:var(--g);font-weight:700}
.fwdots::after{content:'...';display:inline-block;animation:fdots 1.4s steps(4,end) infinite;width:1.4em;text-align:left;overflow:hidden;vertical-align:bottom}
.fwcancel{margin-top:10px;width:100%}
@keyframes fwob{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}80%{transform:rotate(16deg)}}
@keyframes fdots{0%{width:0}50%{width:1.05em}100%{width:1.4em}}
html[lang=ur] body{font-family:"Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;line-height:1.7}
html[dir=rtl] .fm,html[dir=rtl] .to{text-align:right}
@keyframes pg{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes nbp{0%{transform:scale(.7)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes nbi{0%{transform:scale(.45) rotate(-14deg)}55%{transform:scale(1.22) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes nbs{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes nbr{0%{opacity:.45;transform:scale(.8)}100%{opacity:0;transform:scale(1.32)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fout{to{opacity:0;transform:scale(1.04)}}
@keyframes grow{from{width:0}}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#v>*{animation:pg .38s cubic-bezier(.2,.8,.2,1) both}
#v>*:nth-child(2){animation-delay:.05s}#v>*:nth-child(3){animation-delay:.1s}#v>*:nth-child(4){animation-delay:.15s}#v>*:nth-child(5){animation-delay:.2s}#v>*:nth-child(6){animation-delay:.25s}#v>*:nth-child(n+7){animation-delay:.3s}
#sbox>*{animation:pg .35s ease both}
.tlR{animation:pg .4s ease both}.fm{animation:pg .35s ease both}
.bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.ov{animation:fade .2s ease}.sh{animation:up .32s cubic-bezier(.2,.9,.3,1)}
.ov.out,.wl.out{animation:fout .3s ease forwards}

/* v92: khata band (fasal archive) | v93: search box halca neela | v95: login par dono zubanein | v96: splash/welcome par sirf ek zaban | v97: screen ke hisab se text scale + farmer signup name/number autofill | v98: farmer theme card swatches + awaaz + font check */
.kclose{border:2px solid var(--g);color:var(--g);font-weight:800;background:var(--card);box-shadow:0 2px 6px rgba(11,60,107,.10)}
.kclose:active{transform:translateY(1px)}
.arow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;min-height:44px;cursor:pointer}
.arow2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;min-width:0}
#q{background:linear-gradient(180deg,#EAF5FD,#D4EAFA);color:var(--ink);border:1.5px solid #A5CFEA;font-weight:600;box-shadow:inset 0 2px 4px rgba(11,60,107,.05),0 2px 8px rgba(21,128,184,.14)}
#q::placeholder{color:#4E7FA0;font-weight:600}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
html[data-th=raat] #q{background:linear-gradient(180deg,#182F40,#122535);color:var(--ink);border-color:#2E5A78;box-shadow:none}
html[data-th=raat] #q::placeholder{color:#8FA6B8}

/* v1.3.4: Malik-Kisan Paighaam (chat) */
.chatw{display:flex;flex-direction:column;height:calc(100vh - 290px);min-height:330px}
@supports (height:100dvh){.chatw{height:calc(100dvh - 290px)}}
.mhd{display:flex;align-items:center;gap:10px;padding:8px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mbk{border:none;background:var(--g2);color:var(--g);width:36px;height:36px;border-radius:12px;font-size:calc(19px*var(--fs));line-height:1;flex:none;cursor:pointer;padding:0}
.mbub{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px 10px;-webkit-overflow-scrolling:touch}
.mday{align-self:center;background:var(--g2);color:var(--g);font-size:calc(11.5px*var(--fs));font-weight:700;padding:3px 12px;border-radius:99px;margin:6px 0}
.mrowb{max-width:84%;padding:8px 12px 4px;border-radius:15px}
.mrowb.me{align-self:flex-end;background:var(--h1);color:#fff;border-end-end-radius:5px}
.mrowb.ta{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--ink);border-end-start-radius:5px}
.mbub1{display:block;font-family:var(--uf);font-size:calc(15px*var(--fs));line-height:1.8;word-break:break-word;white-space:pre-wrap}
.mtm{display:block;text-align:end;font-size:calc(10px*var(--fs));opacity:.65;margin-top:2px}
.mrow{display:flex;gap:8px;padding:9px 0 2px;border-top:1px solid var(--line);margin-top:6px;align-items:center}
.mrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:calc(15px*var(--fs));font-family:inherit}
.mrow input:focus{outline:2px solid var(--g2);border-color:var(--g)}
.msend{flex:none;border:none;background:var(--g);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:calc(14px*var(--fs));cursor:pointer}
.mchips{display:flex;gap:6px;flex-wrap:wrap;padding:7px 0 0}
.mchip{border:1px solid var(--line);background:var(--card);color:var(--g);border-radius:99px;padding:6px 12px;font-size:calc(12.5px*var(--fs));font-family:var(--uf);cursor:pointer}
.mbdg{position:absolute;top:1px;inset-inline-end:4px;background:var(--red);color:#fff;font-style:normal;font-size:calc(10.5px*var(--fs));font-weight:800;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:99px;padding:0 4px}
/* v1.3.8: chat icon (band/list/fkli rows) + us ka apna unread badge */
.cbtn{position:relative;flex:none;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;transition:transform .15s ease}
.cbtn:active{transform:scale(.88)}
.cbtn svg{width:19px;height:19px;pointer-events:none}
.cband .cbtn{margin-inline-start:auto;z-index:1}
.fm .cbtn,.fklih .cbtn{pointer-events:auto;background:var(--g2);border:1px solid var(--line);color:var(--g)}
.fklih .cbtn{margin-inline-start:auto}
.cbtn .mbdg{top:-5px;inset-inline-end:-5px;box-shadow:0 1px 4px rgba(0,0,0,.28);z-index:2}
/* v1.3.5: voice message */
.mmic{flex:none;border:1px solid var(--line);background:var(--card);color:var(--g);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mmic:active{background:var(--g2)}
.mmic svg{width:20px;height:20px}
.mdot{flex:none;width:10px;height:10px;border-radius:99px;background:var(--red);animation:mpulse 1s infinite}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.25}}
#mrt{font-size:calc(13px*var(--fs));color:var(--ink);min-width:36px;text-align:center}
.mrlab{flex:1;min-width:0;color:var(--red);font-weight:700;font-size:calc(13px*var(--fs));font-family:var(--uf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msend.sx{background:var(--card);color:var(--mut);border:1px solid var(--line)}
.mvb{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
.vpl{flex:none;width:34px;height:34px;border-radius:99px;border:none;background:rgba(255,255,255,.28);color:#fff;font-size:calc(14px*var(--fs));line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mrowb.ta .vpl{background:var(--g2);color:var(--g)}
.vdur{font-size:calc(12.5px*var(--fs));opacity:.85;white-space:nowrap}
.mvb .mtm{margin-inline-start:auto;flex:none}

st('☁️ Online save ho gaya')}catch(e){st('⚠️ Online save nahi hua (phone mein save hai)')}},500)}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

const pad=n=>String(n).padStart(2,'0');

const durR=m=>m<=0?'0 min':((m>=60?(Math.floor(m/60)===1?'1 ghanta':Math.floor(m/60)+' ghantay'):'')+(m>=60&&m%60?' ':'')+(m%60?m%60+' min':''));

const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+a};
const mins=(s,e)=>{if(!s||!e)return 0;const a=s.split(':'),b=e.split(':');let m=(b[0]*60+ +b[1])-(a[0]*60+ +a[1]);if(m<0)m+=1440;return m};

let hf='all';

const _isUr=n=>/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(String(n||'').trim().charAt(0));
/* Roman/English: A se Z pehle, phir Urdu naam (ا se ے). Urdu zuban: pehle Urdu naam (ا se ے), phir A se Z. */
function farmCmp(a,b){const ua=_isUr(a.name),ub=_isUr(b.name);if(ua!==ub)return(ua?1:-1)*((FORCE_LANG||ST.lang)==='ur'?-1:1);return(ua?_cUr:_cEn).compare(String(a.name||'').trim(),String(b.name||'').trim())}

return a.length?a.map(f=>{const t=tot(f);return`<button class="fm" onclick="open_('${f.id}')"><div style="display:flex;align-items:center;gap:12px;min-width:0">${av(f,46)}<div style="min-width:0"><b class="nt"><span class="nt">${esc(f.name)}</span></b><small><span class="nt">${esc([f.phone,f.addr].filter(Boolean).join(' • ')||'—')}</span> • ${dur(t.mn)||'0 min'}</small></div></div>${dueP(t)}<span class="qrbtn" role="button" aria-label="QR" title="QR" onclick="event.stopPropagation();fqrOpen('${f.id}')">QR</span></button>`}).join(''):'<div class="empty">'+(db.farmers.length?'Koi kisan nahi mila.':'Abhi koi kisan nahi. Upar se "Naya Kisan" dabayein.')+'</div>'}
let _ft=0;function filtD(){clearTimeout(_ft);_ft=setTimeout(filt,150)}
function filt(){$('list').innerHTML=listH($('q').value)}
function home(){cur=null;view='home';navR();twEnsure();
const all=TF().map(tot),bill=all.reduce((a,t)=>a+t.bill,0),paid=all.reduce((a,t)=>a+t.paid,0),old=all.reduce((a,t)=>a+t.old,0);
/* v1.1.1: kamai card center + **** mask */

$('v').innerHTML=`${twBar()}<div class="card big sgold band"><div class="cband cb-gold"><span class="bi">💰</span><h2>Meri Total Kamai</h2><button class="bchip" onclick="toggAmt()" aria-label="Hide / show">${hA?'🙈':'👁️'}</button></div><div class="cbody" style="text-align:center"><strong style="margin-top:0">${hA?MK:rs(bill+old)}</strong>

const DPC=new Map();
function dpSrc(d){let u=DPC.get(d);if(u)return u;try{const i=d.indexOf(','),m=/^data:([^;,]+)/.exec(d)[1],b=atob(d.slice(i+1)),a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);u=URL.createObjectURL(new Blob([a],{type:m}))}catch(e){u=d}DPC.set(d,u);return u}
function av(f,z){const st='width:'+z+'px;height:'+z+'px;font-size:'+Math.round(z*.42)+'px';if(f.dp)return'<img class="av" loading="lazy" decoding="async" style="'+st+'" src="'+dpSrc(f.dp)+'" alt="">';const n=(f.name||'?').trim();let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%6;return'<span class="av" style="'+st+';background:'+AVC[h]+'">'+esc(n.charAt(0).toUpperCase())+'</span>'}

function tlTog(el){if(!el)return;const c=el.classList&&el.classList.contains('tlC')?el:(el.closest?el.closest('.tlC'):null);if(!c)return;const was=c.classList.contains('on');const all=document.querySelectorAll('.tlC.on');for(let i=0;i<all.length;i++)all[i].classList.remove('on');if(!was)c.classList.add('on')}

let cm='',pd='',h='';

let ic,cls,tit,alt,sub='';
if(p){ic='💰';cls='tlP';tit=BT('Wasooli');alt=tit;sub=(hwIc(o.how)||'')+'<b class="tlChip">'+esc(o.how||'Cash')+'</b>'}
else if(od){ic='📜';cls='tlO';tit=BT('Purana baqaya');alt=tit;sub=(o.note&&o.note!=='Pichle saal ka baqaya')?'<span class="tlNote">'+esc(o.note)+'</span>':''}
else{ic='💧';cls='tlE';tit='<bdi>'+(UR?tlTur(o.start,o.end):tlT12(o.start,o.end))+'</bdi>';alt=(UR?tlTur(o.start,o.end):tlT12(o.start,o.end));sub='<b class="tlChip">⏱ '+dur(o.mins)+'</b>'+(o.note?'<span class="tlNote">'+esc(o.note)+'</span>':'')}

${f.fcode?fcCard(f):''}

if(b.type==='tubewell'){const t=b.data.tw;if(!ST.tws.some(x=>x.id===t.id))ST.tws.splice(Math.min(Math.max(+b.data.idx||0,0),ST.tws.length),0,Object.assign({},t));
BIN.filter(x=>x.type==='kisan'&&x.twd===t.id).forEach(x=>{if(!db.farmers.some(f=>f.id===x.fid))db.farmers.push(x.data)});
BIN=BIN.filter(x=>x.id!==id&&x.twd!==t.id);saveST();twPush();saveBin();save();toast('Wapas aa gaya');setV();return}
if(b.type==='kisan'){if(db.farmers.some(f=>f.id===b.fid)){toast('Ye kisan pehle se maujood hai')}else{db.farmers.push(b.data);ensureFCodes()}}
else{const f=db.farmers.find(x=>x.id===b.fid);if(!f){alert('Pehle "'+b.fname+'" kisan ko wapas layein');return}(b.type==='entry'?f.entries:b.type==='purana'?(f.olds=f.olds||[]):f.pays).push(b.data)}
BIN=BIN.filter(x=>x.id!==id);saveBin();save();toast('Wapas aa gaya');setV()}
function binDel(id){const b=BIN.find(x=>x.id===id);if(!b||!confirm('Ye hamesha ke liye hat jayega, wapas nahi aayega. Pakka?'))return;const gs=b.type==='tubewell'?BIN.filter(x=>x.twd===b.fid):[];binPh(b);gs.forEach(binPh);BIN=BIN.filter(x=>x.id!==id&&!gs.includes(x));saveBin();setV()}
function binClear(){if(!BIN.length||!confirm('Deleted box ki saari cheezein hamesha ke liye hat jayengi. Pakka?'))return;BIN.forEach(binPh);BIN=[];saveBin();setV()}

cord: ':{en:'Record: ',ur:'ریکارڈ: '},'(record nahi mila)':{en:'(record not found)',ur:'(ریکارڈ نہیں ملا)'},'Account: ':{en:'Account: ',ur:'اکاؤنٹ: '},'✓ Link karein':{en:'✓ Accept & link',ur:'✓ لنک کریں'},'Ye link request reject karein?':{en:'Reject this link request?',ur:'یہ لنک درخواست مسترد کریں؟'},'Kisan link ho gaya! Ab ye account apna khata dekh sakta hai.':{en:'Farmer linked! This account can now see its khata.',ur:'کسان لنک ہو گیا! اب یہ اکاؤنٹ اپنا کھاتہ دیکھ سکتا ہے۔'},'Linked account: ':{en:'Linked account: ',ur:'لنک شدہ اکاؤنٹ: '},'🔓 Account unlink karein':{en:'🔓 Unlink account',ur:'🔓 اکاؤنٹ لنک ختم کریں'},'Kisan apne mobile par QR scan kare ga — khata foran link ho jaye ga aur aap ko mobile ka naam likha notification mile gi. Link khatam karne ka button aap ke paas rahe ga.':{en:'The farmer scans the QR on their phone — the khata links instantly and you get a notification with the phone name. You can unlink anytime with the button below.',ur:'کسان اپنے موبائل پر QR اسکین کرے گا — کھاتہ فوراً لنک ہو جائے گا اور آپ کو موبائل کے نام کے ساتھ اطلاع ملے گی۔ لنک ختم کرنے کا بٹن ہمیشہ آپ کے پاس رہے گا۔'},'Is kisan ka account link khatam karein? Wo ab apna khata nahi dekh sakega. (Code wahi rahega — dobara link ho sakta hai)':{en:'Unlink this farmer? They will no longer see their khata. (The code stays — they can be linked again)',ur:'اس کسان کا اکاؤنٹ لنک ختم کریں؟ وہ اب اپنا کھاتہ نہیں دیکھ سکے گا۔ (کوڈ وہی رہے گا — دوبارہ لنک ہو سکتا ہے)'},'Account unlink ho gaya':{en:'Account unlinked',ur:'اکاؤنٹ لنک ختم ہو گیا'},'Aap ka khata link ho chuka hai — malik ke record ka intezar (internet chahiye).':{en:'Your khata is linked — waiting for the owner record (internet needed).',ur:'آپ کا کھاتہ لنک ہو چکا ہے — مالک کے ریکارڈ کا انتظار (انٹرنیٹ چاہیے۔)'},'sirf parne ke liye':{en:'read only',ur:'صرف پڑھنے کے لیے'},'Ye kisan record ab mojood nahi (delete ho chuka hai). Request reject kar dein.':{en:'This farmer record no longer exists (deleted). Reject the request.',ur: async function lreqAct(id,s){const r=LREQ.find(x=>x.id===id);if(!r||!FS)return;
if(s==='rejected'){if(!confirm(BT('Ye link request reject karein?')))return;
try{await FS.collection('lreq').doc(id).update({status:'rejected',upAt:Date.now()});toast(BT('Request reject ho gayi'))}catch(e){alert('Masla: '+(e.code||e.message))}return}
const f=db.farmers.find(x=>x.id===r.frId);
if(!f){alert(BT('Ye kisan record ab mojood nahi (delete ho chuka hai). Request reject kar dein.'));return}
if(f.linkedUid&&f.linkedUid!==r.uid&&!confirm(BT('Ye kisan pehle se doosre account se linked hai. Account tabdeel karein?')))return;
const others=db.farmers.filter(x=>x.linkedUid===r.uid&&x.id!==r.frId);
if(others.length>=5){alert('"'+(f.name||'Kisan')+'" is account se link nahi ho sakta — limit poori. Ek account par zyada se zyada 5 kisan records link ho sakte hain, aur is account par pehle se 5 linked hain. Kisi ek record ka link khatam karein (unlink) ya ye request reject karein.');return}
if(!confirm('"'+(f.name||'Kisan')+'" (code '+r.code+') ko is account se link karein?\nAccount: '+((r.email||r.name||'')||'-')+'\nQabool karne ke baad ye account is kisan ka poora khata dekh sakega.'))return;
f.linkedUid=r.uid;f.linkedEmail=r.email||'';f.linkedAt=Date.now();lastFC[f.id]=f.fcode;lastFD[f.id]=fdsig(f);save();fdSet(f);
try{await FS.collection('lreq').doc(id).update({status:'accepted',upAt:Date.now()})}catch(e){}
ding();toast(BT('Kisan link ho gaya! Ab ye account apna khata dekh sakta hai.'))}

function qrDraw(code){try{const cv=$('qrcv');if(!cv)return;const ctx=cv.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,cv.width,cv.height);if(typeof qrcode!=='function')throw 0;const q=qrcode(0,'M');q.addData(code);q.make();const n=q.getModuleCount(),QZ=4,W=cv.width,sc=Math.floor(W/(n+QZ*2)),off=Math.floor((W-sc*n)/2);ctx.fillStyle='#0F172A';for(let r=0;r<n;r++){for(let c=0;c<n;c++){if(q.isDark(r,c))ctx.fillRect(off+c*sc,off+r*sc,sc,sc)}}}catch(e){try{const cv=$('qrcv'),ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#0F172A';ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.fillText(code,cv.width/2,cv.height/2)}catch(e2){}}}

function qscanStart(){try{const v=$('qsv');if(!v)return;if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){qscanHelp('nosupport');return}navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}).then(function(s){qSt=s;try{v.srcObject=s}catch(e2){}try{v.muted=true;v.play()}catch(e3){}if(!qBD&&('BarcodeDetector' in window)){try{qBD=new BarcodeDetector({formats:['qr_code']})}catch(e4){qBD=null}}qTm=setInterval(qscanTick,170)}).catch(function(){qscanHelp('denied')})}catch(e){qscanHelp('denied')}}
function qscanTick(){try{const v=$('qsv');if(!v||!qSt)return;if(v.readyState<2)return;const go=function(t){if(!t)return;const s=String(t).trim().toUpperCase();const m=s.match(/FR-[A-Z0-9]{6}/);if(m)qscanHit(m[0])};if(qBD){qBD.detect(v).then(function(cs){go(cs&&cs.length?cs[0].rawValue:null)}).catch(function(){qscanCv(go)});return}qscanCv(go)}catch(e){}}
function qscanCv(go){try{const v=$('qsv');if(!v||typeof jsQR!=='function')return;const c=document.createElement('canvas');const w=Math.min(v.videoWidth||320,480),h=Math.min(v.videoHeight||240,480);if(!w||!h)return;c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);const d=x.getImageData(0,0,w,h);const r=jsQR(d.data,w,h,{inversionAttempts:'dontInvert'});if(r&&r.data)go(r.data)}catch(e){}}

function qscanDecode(file){try{const fr=new FileReader();fr.onload=function(){try{const img=new Image();img.onload=function(){try{const iw=img.naturalWidth||img.width||0,ih=img.naturalHeight||img.height||0;if(!iw||!ih){qscanNoQR();return}const cap=1200,sc=(iw>cap||ih>cap)?cap/Math.max(iw,ih):1,w=Math.max(1,Math.round(iw*sc)),h=Math.max(1,Math.round(ih*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);const idata=cx.getImageData(0,0,w,h);let r=null;try{r=jsQR(idata.data,w,h)}catch(e2){r=null}const code=(r&&r.data)?(String(r.data).toUpperCase().match(/FR-[A-Z0-9]{6}/)||[null])[0]:null;if(code){qscanHit(code)}else{qscanNoQR()}}catch(e3){qscanNoQR()}};img.onerror=function(){qscanNoQR()};img.src=fr.result}catch(e4){qscanNoQR()}};fr.onerror=function(){qscanNoQR()};fr.readAsDataURL(file)}catch(e){}}

async function fkWaitCancel(id){const r=FLREQ.find(x=>x.id===id);if(!r)return;
if(r.status!=='pending'){toast(BT('Ye request pehle hi process ho chuki hai'));return}
if(!confirm(BT('Kya ye link request wapas lein? Malik is ko ab qabool nahi kar sake ga.')))return;
if(!FS){alert(BT('Internet nahi hai.'));return}

const TN=new WeakMap();
function trNode(n){if(n.nodeType===3){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest('.nt')))return;const v=n.nodeValue,i=TN.get(n);if(i&&v===i.t)return;const t=trT(v);TN.set(n,{o:v,t});if(t!==v)n.nodeValue=t}

const fmtDur=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+pad(s%60)};

const VCAP=620*1024,VSFT=560*1024;
const voiceMime=()=>{if(!window.MediaRecorder)return'';const L=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm'];for(let i=0;i<L.length;i++){try{if(MediaRecorder.isTypeSupported(L[i]))return L[i]}catch(e){}}return''};
function recUI(on){const a=$('mrow'),b=$('mrec');if(a)a.style.display=on?'none':'';if(b)b.style.display=on?'flex':'none'}
function voiceHalt(){try{if(recMR&&recMR.state==='recording'){recSend=0;recMR.stop()}}catch(e){}recMR=null;try{if(recTimer){clearInterval(recTimer)}}catch(e){}recTimer=null;try{if(recStream){recStream.getTracks().forEach(t=>t.stop())}}catch(e){}recStream=null;recChunks=[];recBytes=0;recSend=0;try{recUI(0)}catch(e){}try{if(curAU){curAU.pause();curAU=null}}catch(e){}}
function voiceTick(){const s=Math.floor((Date.now()-recT0)/1000),e=$('mrt');if(e)e.textContent=fmtDur(s);if(s>=60){try{toast(BT('Voice 60 second tak hi ho sakti hai'))}catch(_){}voiceStop();return}
if(recBytes>=VSFT){try{toast(BT('Voice bohat lambi ho gayi — jo record hui wo bhej rahe hain'))}catch(_){}voiceStop()}}
function voiceStart(){if(!chatOpenId)return;if(!navigator.mediaDevices||!window.MediaRecorder){toast(BT('Is phone par voice recording nahi hoti'));return}if(recMR&&recMR.state==='recording')return;
const arm=st=>{if(!chatOpenId){try{st.getTracks().forEach(t=>t.stop())}catch(e){}return}
recSend=0;recChunks=[];recBytes=0;recMime=voiceMime();
try{recMR=recMime?new MediaRecorder(st,{mimeType:recMime,audioBitsPerSecond:24000}):new MediaRecorder(st)}catch(e){try{recMR=new MediaRecorder(st);recMime=''}catch(e2){toast(BT('Is phone par voice recording nahi hoti'));try{st.getTracks().forEach(t=>t.stop())}catch(_){}recMR=null;if(recStream===st)recStream=null;return}}
recMR.ondataavailable=ev=>{if(ev.data&&ev.data.size){recChunks.push(ev.data);recBytes+=ev.data.size}};

try{recMR.start(1000)}catch(e){try{if(recStream){recStream.getTracks().forEach(t=>t.stop())}}catch(_){}recStream=null;recMR=null;if(!voiceStart._fb){voiceStart._fb=1;setTimeout(()=>{try{voiceStart()}catch(_){}},60);return}voiceStart._fb=0;toast(BT('Is phone par voice recording nahi hoti'));return}

if(recStream&&recStream.getTracks().length&&recStream.getTracks().every(t=>t.readyState==='live')){arm(recStream);return}
if(recStream){try{recStream.getTracks().forEach(t=>t.stop())}catch(e){}recStream=null}

if(!chatOpenId){try{st.getTracks().forEach(t=>t.stop())}catch(e){}return}
recStream=st;arm(st)}).catch(()=>toast(BT(micHad()?'Mic ki ijazat pehle mil chuki thi — dobara nahi mil rahi, phone ki settings se is browser ko mic Allow karein':'Mic ki ijazat nahi mili — phone ki settings se mic on karein')))}
function voiceStop(){if(!recMR||recMR.state!=='recording'){try{recUI(0)}catch(e){}return}recSend=1;try{recMR.stop()}catch(e){voiceDone()}}

if(!send||!chunks.length)return;try{voiceSend(new Blob(chunks,{type:mime||'audio/webm'}),dur,mime)}catch(e){}}

function voiceSend(blob,dur,mime){if(!chatOpenId||!blob||!blob.size)return;
if(blob.size>VCAP){toast(BT('Yeh voice bohat bari hai — thora chhota voice bhejein'));return}
const cid=chatOpenId,mid='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),at=Date.now(),my=mySide();
const fin=du=>{const au=(String(du||'').split(',')[1]||'').trim();if(!au)return;

const on=ST.role==='owner'?(ST.fname||ST.name||'Malik'):((FDATA&&FDATA.oname)||'');
const fn=ST.role==='owner'?chatName:(ST.fname||(U&&U.displayName)||'Kisan');

msgSaveQ();flushMsgQ();
const c=CHATS[cid];if(c){c.lt='🎤 Voice';c.la=at}};
try{const r=new FileReader();r.onload=()=>fin(r.result);r.onerror=()=>toast(BT('Is phone par voice recording nahi hoti'));r.readAsDataURL(blob)}catch(e){toast(BT('Is phone par voice recording nahi hoti'))}}
function voiceTap(mid,btn){const m=MSGS.find(x=>x.id===mid)||(chatOpenId?(chatCacheGet(chatOpenId)||[]).find(x=>x.id===mid):null);if(!m||m.ty!=='v')return;
if(m.err){try{retryMsg(mid)}catch(e){}return}
try{if(curAU){curAU.pause();curAU=null}}catch(e){}
const play=(au,am)=>{if(!au){try{if(btn)btn.textContent='▶'}catch(e){}return}
let a=null,u='';const ty=String(am||m.am||'audio/webm').split(';')[0]||'audio/webm';
try{const bin=atob(au),bb=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bb[i]=bin.charCodeAt(i);u=URL.createObjectURL(new Blob([bb],{type:ty}));a=new Audio(u)}catch(e){}
if(!a){try{a=new Audio('data:'+ty+';base64,'+au)}catch(e2){}}
if(!a){toast(BT('Yeh voice is phone par nahi chal sakti'));return}
curAU=a;try{if(btn)btn.textContent='⏸'}catch(e){}
const end=()=>{try{if(btn)btn.textContent='▶'}catch(e){}try{if(curAU===a)curAU=null}catch(e){}try{if(u)URL.revokeObjectURL(u)}catch(e){}};
a.onended=end;
a.onerror=()=>{end();toast(BT('Yeh voice is phone par nahi chal sakti'))};
a.play().catch(()=>{try{if(btn)btn.textContent='▶'}catch(e){}})};
if(m.au)play(m.au,m.am);
else{if(!FS||!navigator.onLine){toast(BT('Voice sunne ke liye internet chahiye'));return}
try{if(btn)btn.textContent='…';const gv=so=>FS.collection('mch').doc(chatOpenId).collection('m').doc(mid).get(so);
const got=s=>{const x=s&&s.data();if(x&&x.au){m.au=x.au;m.am=x.am;if(x.ad)m.ad=x.ad;play(x.au,x.am)}else{try{if(btn)btn.textContent='▶'}catch(e){}toast(BT('Yeh voice abhi load nahi hui — thori dair baad try karein'))}};
const fail=()=>{try{if(btn)btn.textContent='▶'}catch(e){}toast(BT(navigator.onLine?'Yeh voice abhi load nahi hui — thori dair baad try karein':'Voice sunne ke liye internet chahiye'))};
gv().then(got).catch(()=>gv({source:'server'}).then(got).catch(fail))}catch(e){try{if(btn)btn.textContent='▶'}catch(e){}}}}
