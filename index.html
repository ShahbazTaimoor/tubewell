<!doctype html>
<html lang="ur-Latn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Aslam Tubewell"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B3C6B">
<title>Aslam Tubewell App</title>
<style>
:root{--rb:#DCF8E9;--rc:#0A6B3C;--h1:#0B3C6B;--h2:#1580B8;--pt:#fff;--g:#0E6A99;--g2:#E1F1FA;--ink:#12283D;--mut:#5F7487;--line:#D9E6EF;--bg:#F2F7FB;--card:#fff;--red:#B4373F;--redbg:#FDEBEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4FB3E8;--g2:#16303F;--ink:#E4EFF7;--mut:#8FA6B8;--line:#25404F;--bg:#0E1A24;--card:#14232F;--red:#ff8a8a;--redbg:#3A2124}}
:root[data-theme="dark"]{--g:#4FB3E8;--g2:#16303F;--ink:#E4EFF7;--mut:#8FA6B8;--line:#25404F;--bg:#0E1A24;--card:#14232F;--red:#ff8a8a;--redbg:#3A2124}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,"Segoe UI",Arial,sans-serif}
.app{max-width:640px;margin:auto;padding:0 14px 120px}
.top{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:22px 16px;border-radius:0 0 22px 22px;margin:0 -14px 14px}
.top h1{margin:0;font-size:23px}.top small{opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:700}
.p{background:var(--g);color:var(--pt)}.s{background:var(--g2);color:var(--g)}.d{background:var(--redbg);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{text-align:center;padding:18px}.big span{font-size:13px;color:var(--mut)}.big strong{display:block;font-size:34px;margin-top:4px;color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:var(--bg);border-radius:10px;padding:10px}
.grid span{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}.grid b{font-size:15px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.f label{font-size:13px;font-weight:700;color:var(--mut)}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.fm{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:14px;margin-bottom:9px;border-radius:14px}
.fm small{display:block;color:var(--mut);font-weight:400;margin-top:3px}
.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:var(--g2);color:var(--g);white-space:nowrap}.pill.r{background:var(--redbg);color:var(--red)}
h2{font-size:17px;margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:12px}
.prev{background:var(--g2);color:var(--g);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;font-weight:700}
.ent{border-top:1px solid var(--line);padding:11px 0}.ent:first-of-type{border:0}
.ent .h{display:flex;justify-content:space-between;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:18px}
.hide{display:none!important}
.mini{padding:6px 10px;font-size:12px}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.f{min-width:0}
.bar{height:10px;background:var(--g2);border-radius:99px;overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.it{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}.it:first-of-type{border:0}
.db{min-width:56px;text-align:center;background:var(--g2);color:var(--g);border-radius:12px;padding:7px 4px}.db b{display:block;font-size:21px;line-height:1.1}.db span{display:block;font-size:10px}
.it.pay .db{background:#fff4d6;color:#8a6200}
.im{flex:1;min-width:0}.im b{font-size:14px}.im small{display:block;color:var(--mut);margin-top:3px}
.ac{display:flex;gap:6px;margin-top:8px}.ia{text-align:right;white-space:nowrap}.ia b{display:block;font-size:15px}.ia small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.pos{color:var(--g)}.neg{color:var(--red)}
.call{background:var(--g);color:var(--pt);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:12px;white-space:nowrap}
.top{position:relative}.th{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.2);color:#fff;padding:8px 12px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);color:var(--ink);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.to{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;margin-bottom:8px;padding:12px}.to.on{border-color:var(--g)}.to b{flex:1}
.sw{width:58px;height:40px;border-radius:10px;position:relative;display:block;overflow:hidden}.sw i{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%}.sw i:first-child{left:8px}.sw i:last-child{left:30px}
select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit}
.rate{background:var(--rb);color:var(--rc);padding:2px 9px;border-radius:8px;font-weight:800;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none}
.nav>div{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px;display:flex;gap:8px;box-shadow:0 8px 26px rgba(0,0,0,.2)}
.nb{background:var(--bg);color:var(--ink);border-radius:99px;width:52px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;gap:8px}
.nb.on{background:var(--g);color:var(--pt);width:auto;padding:0 18px}.nb svg{width:22px;height:22px}
.h2d{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph{display:block;width:64px;height:64px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:40;font-size:14px}
.call{display:flex;align-items:center;justify-content:center;gap:8px}.wa{background:#1FAF55;color:#fff}
html,body{touch-action:pan-x pan-y}input,select,textarea{font-size:16px}
.tm{margin:14px 0 8px 66px}.tm span{background:var(--g2);color:var(--g);font-weight:800;font-size:12px;padding:5px 12px;border-radius:99px}
.tl{display:flex;gap:10px;margin-bottom:10px}.td{width:44px;text-align:right}.td b{display:block;font-size:17px}.td span{font-size:11px;color:var(--mut)}
.tx{width:12px;display:flex;flex-direction:column;align-items:center}.tx i{width:12px;height:12px;border-radius:50%;background:var(--g);margin-top:5px;flex:none}.tx i.pd{background:#1FAF55}.tx u{flex:1;width:2px;background:var(--line)}
.tc{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.tc.pc{background:rgba(31,175,85,.14)}.tc .h2d b{font-size:13px}
</style></head>
<body><div class="app">
<header class="top"><small>Pani ka hisab</small><h1 id="appn">💧 Aslam Tubewell App</h1><small>Rate: <span class="rate" id="rt">Rs 500 fi ghanta</span> • v13</small><div class="sm" id="sync" style="margin-top:6px;opacity:.9">Check ho raha hai…</div></header>
<div id="v"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
let RATE=500;const KEY='aslam_tubewell_v1';
let db={farmers:[],ts:0},cur=null,dl=null,timer=null,U=null,FS=null,AU=null,lastP={},unsub=null;
try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r)}catch(e){}
function st(t){const s=document.getElementById('sync');if(s)s.textContent=t}
const wnum=p=>{let n=String(p||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='92'+n.slice(1);else if(n.length===10)n='92'+n;return n};
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,x=>x.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
const sig=f=>JSON.stringify([f.name,f.phone,f.addr,f.entries,f.pays]);
function push(){if(!U||!FS)return;clearTimeout(timer);timer=setTimeout(async()=>{try{
const col=FS.collection('users').doc(U.uid).collection('farmers'),bt=FS.batch();let n=0;
db.farmers.forEach(f=>{const g=sig(f);if(lastP[f.id]!==g){f.ts=Date.now();bt.set(col.doc(f.id),{json:JSON.stringify(f),ts:f.ts});lastP[f.id]=g;n++}});
Object.keys(lastP).forEach(id=>{if(!db.farmers.some(f=>f.id===id)){bt.delete(col.doc(id));delete lastP[id];n++}});
if(n){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}await bt.commit()}
st('☁️ Online save ho gaya')}catch(e){st('⚠️ Online save nahi hua (phone mein save hai)')}},500)}
const save=()=>{db.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}push()};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs '+Math.round(n).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=m=>m<=0?'0 min':((m>=60?(Math.floor(m/60)===1?'1 ghanta':Math.floor(m/60)+' ghantay'):'')+(m>=60&&m%60?' ':'')+(m%60?m%60+' min':''));
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+a};
const mins=(s,e)=>{if(!s||!e)return 0;const a=s.split(':'),b=e.split(':');let m=(b[0]*60+ +b[1])-(a[0]*60+ +a[1]);if(m<0)m+=1440;return m};
const tot=f=>{const bill=f.entries.reduce((a,e)=>a+e.amt,0),paid=f.pays.reduce((a,p)=>a+p.amt,0),mn=f.entries.reduce((a,e)=>a+e.mins,0);return{bill,paid,mn,due:bill-paid}};
const dueP=t=>`<span class="pill ${t.due>0?'r':''}">${t.due>0?'Baqaya '+rs(t.due):t.due<0?'Ziada '+rs(-t.due):'Hisab saaf'}</span>`;

function listH(q){q=(q||'').trim().toLowerCase();const a=db.farmers.filter(f=>!q||(f.name+' '+f.phone+' '+f.addr).toLowerCase().includes(q));
return a.length?a.map(f=>{const t=tot(f);return`<button class="fm" onclick="open_('${f.id}')"><div><b>${esc(f.name)}</b><small>${esc([f.phone,f.addr].filter(Boolean).join(' • ')||'—')} • ${dur(t.mn)||'0 min'}</small></div>${dueP(t)}</button>`}).join(''):'<div class="empty">'+(db.farmers.length?'Koi kisan nahi mila.':'Abhi koi kisan nahi. Upar se "Naya Kisan" dabayein.')+'</div>'}
function filt(){$('list').innerHTML=listH($('q').value)}
function home(){cur=null;view='home';navR();
const all=db.farmers.map(tot),bill=all.reduce((a,t)=>a+t.bill,0),paid=all.reduce((a,t)=>a+t.paid,0);
$('v').innerHTML=`<div class="card big"><span>Meri Total Kamai</span><strong>${rs(bill)}</strong>
<div class="grid" style="margin-top:12px;text-align:left"><div><span>Wasool hua</span><b>${rs(paid)}</b></div><div><span>Baqaya</span><b>${rs(bill-paid)}</b></div></div></div>
<button class="p" style="width:100%;margin-bottom:12px" onclick="$('addBox').classList.toggle('hide')">＋ Naya Kisan</button>
<div id="addBox" class="card hide"><h2>Naya Kisan</h2>
<div class="f"><label>Kisan ka naam</label><input id="fn" placeholder="Naam"></div>
<div class="f"><label>Number</label><input id="fp" type="tel" placeholder="03xx-xxxxxxx"></div>
<div class="f"><label>Rehaish</label><input id="fa" placeholder="Gaon / ilaqa"></div>
<button class="p" style="width:100%" onclick="addF()">Save karein</button></div>
${db.farmers.length?'<input id="q" type="search" placeholder="🔍 Kisan ka naam dhoondein" oninput="filt()" style="margin-bottom:10px">':''}<div id="list">${listH('')}</div>
`}

function addF(){const n=$('fn').value.trim();if(!n){alert('Kisan ka naam likhein');return}
db.farmers.push({id:uid(),name:n,phone:$('fp').value.trim(),addr:$('fa').value.trim(),entries:[],pays:[]});save();home()}

let eid=null;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dbx=d=>{const[y,m,dd]=d.split('-');return`<div class="db"><b>${+dd}</b><span>${MN[m-1]}</span><span>${y}</span></div>`};
function tlH(L,f){if(!L.length)return'<div class="empty">Abhi koi entry nahi.</div>';let cm='',h='';
L.forEach(r=>{const o=r.o,p=r.k==='p',mk=o.date.slice(0,7);
if(mk!==cm){cm=mk;h+=`<div class="tm"><span>${MN[+mk.slice(5)-1]} ${mk.slice(0,4)}</span></div>`}
const d=+o.date.slice(8),mo=MN[+o.date.slice(5,7)-1];
h+=`<div class="tl"><div class="td"><b>${d}</b><span>${mo}</span></div><div class="tx"><i class="${p?'pd':''}"></i><u></u></div><div class="tc${p?' pc':''}"><div class="h2d"><b>${p?'Wasooli':t12(o.start)+' → '+t12(o.end)}</b><b class="${p?'pos':''}">${p?'− ':''}${rs(o.amt)}</b></div><div class="h2d sm mut"><span>${p?esc(o.how||'Cash'):dur(o.mins)+(o.note?' • '+esc(o.note):'')}</span><span class="${r.run>0?'neg':''}">Baqaya ${rs(r.run)}</span></div>${p&&o.img?'<img class="ph" data-pid="'+o.img+'" onclick="viewPh(this)">':''}<div class="ac">${p?'':`<button class="s mini" onclick="open_('${f.id}','${o.id}');window.scrollTo(0,0)">✎ Edit</button>`}<button class="d mini" onclick="${p?'delP':'delE'}('${o.id}')">🗑 Delete</button></div></div></div>`});return h}
function open_(id,ed){cur=id;eid=ed||null;view='home';navR();const f=db.farmers.find(x=>x.id===id);if(!f)return home();const t=tot(f),E=eid?f.entries.find(x=>x.id===eid):null;
const pct=t.bill>0?Math.min(100,Math.round(t.paid/t.bill*100)):0;
const L=[...f.entries.map(o=>({k:'e',d:o.date,s:o.start,o})),...f.pays.map(o=>({k:'p',d:o.date,s:'99',o}))].sort((a,b)=>(a.d+a.s).localeCompare(b.d+b.s));
let run=0;L.forEach(r=>{run+=r.k==='e'?r.o.amt:-r.o.amt;r.run=run});
$('v').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="s" onclick="home()">← Wapas</button><button class="s" onclick="editF()">✎ Kisan edit</button></div>
<div class="card"><h2 style="margin:0">${esc(f.name)}</h2><div class="mut" style="margin-top:8px">🏠 ${esc(f.addr||'—')}</div><div style="margin-top:8px">📞 ${esc(f.phone||'Number nahi likha')}</div>${f.phone?`<div class="row" style="margin-top:10px"><a class="call" href="tel:${f.phone.replace(/[^\d+]/g,'')}">📞 Call karein</a><a class="call wa" target="_blank" rel="noopener" href="https://wa.me/${wnum(f.phone)}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#1FAF55" d="M8.6 7.6c-.3.3-.7 1-.3 2 .6 1.5 1.900 3 3.400 3.900 1 .6 1.900.4 2.300 0l.5-.8-1.800-1-.6.6c-.8-.3-1.900-1.400-2.300-2.300l.6-.6-1-1.800z"/></svg>WhatsApp</a></div>`:''}</div>
<div class="card"><h2>Is kisan ka poora hisab</h2><div class="grid">
<div><span>Total time</span><b>${dur(t.mn)||'0 min'}</b></div><div><span>Total paisay</span><b>${rs(t.bill)}</b></div>
<div><span>Wasool hua</span><b class="pos">${rs(t.paid)}</b></div><div><span>Baqaya</span><b style="color:${t.due>0?'var(--red)':'var(--g)'}">${rs(t.due)}</b></div></div>
<div class="bar"><i style="width:${pct}%"></i></div><div class="mut sm">${pct}% wasool • ${f.entries.length} entries</div></div>
<div class="row" style="margin-bottom:12px"><button class="p" onclick="sheet()">🖼 Hisab ki tasveer</button><button class="s" onclick="sendS()">📝 Message</button></div><div id="sbox"></div>
<div class="card" id="fm"><h2>${E?'✎ Entry edit karein':'💧 Pani ki nayi entry'}</h2>
<div class="f"><label>Date</label><input id="ed" type="date" value="${E?E.date:today()}"></div>
<div class="row"><div class="f"><label>Pani shuru (time)</label><input id="es" type="time" value="${E?E.start:''}" oninput="pv()"><button class="s mini" onclick="$('es').value=nowT();pv()">Abhi</button></div>
<div class="f"><label>Pani khatam (time)</label><input id="ee" type="time" value="${E?E.end:''}" oninput="pv()"><button class="s mini" onclick="$('ee').value=nowT();pv()">Abhi</button></div></div>
<div class="mut sm" style="margin-bottom:8px">Rate: <span class="rate">Rs ${RATE} fi ghanta</span></div><div class="prev"><span>Total time: <span id="pt">—</span></span><span id="pa">Rs 0</span></div>
<div class="f"><label>Note (marzi)</label><input id="en" placeholder="Jaise: gandum ka pani" value="${esc(E?E.note:'')}"></div>
<button class="p" style="width:100%" onclick="addE()">${E?'Tabdeeli save karein':'Entry save karein'}</button>${E?'<button class="s" style="width:100%;margin-top:8px" onclick="open_(cur)">Cancel</button>':''}</div>
<div class="card"><h2>💰 Paisay wasool kiye</h2><div class="row"><div class="f"><label>Rakam</label><input id="pm" type="number" inputmode="numeric" placeholder="Rs"></div><div class="f"><label>Date</label><input id="pd" type="date" value="${today()}"></div></div>
<div class="f"><label>Tareeqa (kaise diye)</label><select id="ph"><option>Cash</option><option>JazzCash</option><option>Easypaisa</option><option>Bank</option><option>Aur</option></select></div><div class="f"><label>Saboot ki tasveer (marzi)</label><input id="pimg" type="file" accept="image/*"></div><button class="s" style="width:100%" onclick="addP()">Wasooli save karein</button></div>
<div class="card"><div class="h2d" style="margin-bottom:10px"><h2 style="margin:0">📒 Poori kitab (${L.length})</h2><button class="s mini" onclick="$('tlend').scrollIntoView({behavior:'smooth',block:'center'})">⬇ Naye tak</button></div>${tlH(L,f)}<div id="tlend"></div></div>
<button class="d" style="width:100%" onclick="delF()">🗑 Yeh Kisan Delete karein</button>`;loadPh();if(E)pv()}

function pv(){const m=mins($('es').value,$('ee').value);$('pt').textContent=m?dur(m):'—';$('pa').textContent=rs(m/60*RATE)}
const F=()=>db.farmers.find(x=>x.id===cur);
function addE(){const s=$('es').value,e=$('ee').value,d=$('ed').value;if(!d||!s||!e){alert('Date, shuru aur khatam time likhein');return}
const m=mins(s,e);if(!m){alert('Shuru aur khatam time ek jaisa hai');return}
const o={date:d,start:s,end:e,mins:m,amt:Math.round(m/60*RATE),note:$('en').value.trim()},f=F();
if(eid){Object.assign(f.entries.find(z=>z.id===eid),o)}else f.entries.push({id:uid(),...o});save();open_(cur)}
async function addP(){const a=Math.round(+$('pm').value);if(!(a>0)){alert('Sahi rakam likhein');return}
const o={id:uid(),date:$('pd').value||today(),amt:a,how:$('ph').value},fl=$('pimg').files[0];

function repV(){view='rep';cur=null;navR();const A=db.farmers.map(f=>({f,t:tot(f)})),bill=A.reduce((a,x)=>a+x.t.bill,0),paid=A.reduce((a,x)=>a+x.t.paid,0),mn=A.reduce((a,x)=>a+x.t.mn,0),ne=A.reduce((a,x)=>a+x.f.entries.length,0);
const M={};db.farmers.forEach(f=>f.entries.forEach(e=>{const k=e.date.slice(0,7);(M[k]=M[k]||{a:0,m:0}).a+=e.amt;M[k].m+=e.mins}));
const ks=Object.keys(M).sort().slice(-6).reverse(),mx=Math.max(1,...ks.map(k=>M[k].a)),due=A.filter(x=>x.t.due>0).sort((a,b)=>b.t.due-a.t.due);
$('v').innerHTML=`<div class="card"><h2>📊 Report</h2><div class="grid"><div><span>Total kamai</span><b>${rs(bill)}</b></div><div><span>Wasool hua</span><b class="pos">${rs(paid)}</b></div><div><span>Baqaya</span><b class="neg">${rs(bill-paid)}</b></div><div><span>Total time</span><b>${dur(mn)||'0 min'}</b></div><div><span>Kisan</span><b>${db.farmers.length}</b></div><div><span>Entries</span><b>${ne}</b></div></div></div>
<div class="card"><h2>Mahine ke hisab se kamai</h2>${ks.length?ks.map(k=>`<div style="margin-bottom:10px"><div class="h2d sm"><span>${MN[+k.slice(5)-1]} ${k.slice(0,4)} • ${dur(M[k].m)}</span><b>${rs(M[k].a)}</b></div><div class="bar" style="margin:5px 0 0"><i style="width:${Math.round(M[k].a/mx*100)}%"></i></div></div>`).join(''):'<div class="empty">Abhi koi data nahi.</div>'}</div>
<div class="card"><h2>Baqaya wale kisan</h2>${due.length?due.map(x=>`<button class="fm" style="margin:0 0 8px" onclick="open_('${x.f.id}')"><b>${esc(x.f.name)}</b><span class="pill r">${rs(x.t.due)}</span></button>`).join(''):'<div class="empty">Kisi ka baqaya nahi 🎉</div>'}</div>`}
function setV(){view='set';cur=null;navR();const lk=ST.cred?'Face ID chalu hai':ST.pin?'Sirf PIN chalu hai':'Band hai';
$('v').innerHTML=`<div class="card"><h2>👤 Profile</h2><div class="f"><label>Tubewell / App ka naam</label><input id="sn" value="${esc(ST.name)}"></div><div class="f"><label>Urdu naam (tasveer ke liye)</label><input id="su" value="${esc(ST.urdu)}"></div><button class="p" style="width:100%" onclick="svP()">Save karein</button></div>
<div class="card"><h2>💰 Rate</h2><div class="mut sm" style="margin-bottom:8px">Abhi: <span class="rate">Rs ${RATE} fi ghanta</span></div><div class="f"><label>Naya rate (Rs fi ghanta)</label><input id="sr" type="number" inputmode="numeric" value="${RATE}"></div><div class="mut sm" style="margin-bottom:10px">Naya rate sirf nayi entries par lagega. Purani entries ke paisay nahi badlenge.</div><button class="p" style="width:100%" onclick="svR()">Rate save karein</button></div>
<div class="card"><h2>🎨 Theme</h2>${Object.keys(TH).map(k=>`<button class="to${k===th?' on':''}" onclick="applyTh('${k}');setV()"><span class="sw" style="background:linear-gradient(135deg,${TH[k].h1},${TH[k].h2})"><i style="background:${TH[k].g}"></i><i style="background:${TH[k].bg}"></i></span><b>${TH[k].n}</b><span>${k===th?'✓':''}</span></button>`).join('')}</div>
<div class="card"><h2>🔒 App Lock</h2><div class="mut sm" style="margin-bottom:10px">Halat: <b>${lk}</b></div><div class="f"><label>Backup PIN (4 se 6 ank)</label><input id="npin" type="password" inputmode="numeric" maxlength="6" placeholder="Naya PIN"></div><button class="p" style="width:100%" onclick="svPin()">PIN save karein</button>
${ST.cred?'<button class="d" style="width:100%;margin-top:8px" onclick="offBio()">Face ID band karein</button>':'<button class="s" style="width:100%;margin-top:8px" onclick="onBio()">Face ID chalu karein</button>'}${ST.pin&&!ST.cred?'<button class="d" style="width:100%;margin-top:8px" onclick="offPin()">PIN hatayein</button>':''}</div>
<div class="card"><h2>💾 Data</h2><div class="row"><button class="s" onclick="bk()">⬇ Backup download</button><button class="s" onclick="$('imp').click()">⬆ Backup wapas</button></div><input id="imp" type="file" accept=".json,application/json" class="hide" onchange="imp(this)"><div class="mut sm" style="margin-top:8px">Backup mein tasveerein shamil nahi hotin.</div></div>
<div class="card"><h2>☁️ Account</h2><div class="mut sm" style="margin-bottom:10px">${esc(U?U.email:'Login nahi')}</div><button class="d" style="width:100%" onclick="logout()">Logout</button></div>
<div class="card"><h2>ℹ️ App ke baare mein</h2><div class="mut sm">${esc(ST.name)} App • Version v10<br>Rate aur lock sirf is phone ke liye hain.</div></div>`}
function svP(){ST.name=$('sn').value.trim()||ST.name;ST.urdu=$('su').value.trim()||ST.urdu;saveST();toast('Save ho gaya')}
function svR(){const r=Math.round(+$('sr').value);if(!(r>0)){alert('Sahi rate likhein');return}ST.rate=r;saveST();toast('Rate save ho gaya');setV()}
const hx=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('aslam'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function svPin(){const v=$('npin').value;if(!/^\d{4,6}$/.test(v)){alert('PIN 4 se 6 ankon ka hona chahiye');return}ST.pin=await hx(v);saveST();toast('PIN save ho gaya');setV()}
async function onBio(){if(!ST.pin){alert('Pehle backup PIN set karein');return}if(!window.PublicKeyCredential){alert('Is phone ya browser mein Face ID support nahi');return}
try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Aslam Tubewell'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner',displayName:'Owner'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});ST.cred=b64u(c.rawId);saveST();toast('Face ID chalu ho gaya');setV()}catch(e){alert('Face ID chalu nahi hui. Dobara koshish karein.')}}
function offBio(){ST.cred='';saveST();setV()}
function offPin(){ST.pin='';saveST();setV()}
function lockNow(){if(!ST.cred&&!ST.pin)return;locked=true;let o=$('lk');if(!o){o=document.createElement('div');o.id='lk';o.className='ov';o.style.cssText='align-items:center;background:var(--bg);z-index:30';document.body.appendChild(o)}
o.innerHTML='<div class="sh" style="border-radius:22px;max-width:380px;margin:16px;text-align:center"><div style="font-size:44px">🔒</div><h2>'+esc(ST.name)+' App</h2><div class="mut sm" style="margin-bottom:14px">App lock laga hua hai</div>'+(ST.cred?'<button class="p" style="width:100%" onclick="tryBio()">🔓 Face ID se kholein</button>':'')+(ST.pin?'<div class="f" style="margin-top:12px"><input id="lkp" type="password" inputmode="numeric" maxlength="6" placeholder="PIN likhein" style="text-align:center"></div><button class="s" style="width:100%" onclick="tryPin()">PIN se kholein</button><button class="mini" style="background:none;color:var(--g);margin-top:8px" onclick="forgotPin()">PIN bhool gaye?</button>':'')+'<div id="lkm" class="sm" style="color:var(--red);min-height:18px;margin-top:8px"></div></div>';if(ST.cred)setTimeout(tryBio,350)}
async function tryBio(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(ST.cred)}],userVerification:'required',timeout:60000}});unlock()}catch(e){const m=$('lkm');if(m)m.textContent='Face ID nahi hui. Dobara dabayein ya PIN likhein'}}
async function tryPin(){const v=$('lkp').value;if(await hx(v)===ST.pin)unlock();else{$('lkm').textContent='PIN galat hai';$('lkp').value=''}}
function unlock(){const o=$('lk');if(o)o.remove();locked=false}
async function forgotPin(){if(!U||!AU){alert('Is ke liye online login chahiye');return}const p=prompt('Apne account ka password likhein ('+U.email+')');if(!p)return;try{await AU.signInWithEmailAndPassword(U.email,p);unlock()}catch(e){$('lkm').textContent='Password galat hai'}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(!locked&&hid&&Date.now()-hid>30000)lockNow()});
function idb(){return new Promise((r,j)=>{const q=indexedDB.open('aslam_ph',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
async function phPut(id,d){const x=await idb();return new Promise(r=>{const t=x.transaction('p','readwrite');t.objectStore('p').put(d,id);t.oncomplete=()=>r()})}
async function phGet(id){try{const x=await idb();return await new Promise(r=>{const q=x.transaction('p').objectStore('p').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function phDel(id){try{const x=await idb();return new Promise(r=>{const t=x.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>r()})}catch(e){}}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function loadPh(){for(const im of document.querySelectorAll('img[data-pid]')){const id=im.dataset.pid;let d=await phGet(id);if(!d&&U&&FS){try{const sn=await FS.collection('users').doc(U.uid).collection('photos').doc(id).get();if(sn.exists){d=sn.data().d;phPut(id,d)}}catch(e){}}if(d)im.src=d}}
function viewPh(im){if(!im.src)return;const o=document.createElement('div');o.className='ov';o.style.cssText='align-items:center;background:rgba(0,0,0,.9);z-index:35';o.onclick=()=>o.remove();o.innerHTML='<img src="'+im.src+'" style="max-width:100%;max-height:90%;border-radius:10px">';document.body.appendChild(o)}
async function bk(){const data=JSON.stringify(db,null,2),fn='aslam-tubewell-backup-'+today()+'.json';try{if(dl){await dl.save({filename:fn,data});return}}catch(e){if(e&&e.code==='declined')return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click()}
function imp(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.farmers))throw 0;if(!confirm('Maujooda data backup se badal jayega. Pakka?'))return;db=x;save();home()}catch(e){alert('Yeh sahi backup file nahi hai')}el.value=''};r.readAsText(fl)}
applySt();navR();lockNow();home();
if(typeof firebase!=='undefined')initFB();else{let last=null;try{last=localStorage.getItem('aslam_uid')}catch(e){}if(!last)showLogin('Pehli baar login ke liye internet chahiye.');else st('⚠️ Offline: data phone mein save hai')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
