html[dir=rtl] .fm,html[dir=rtl] .to{text-align:right}
@keyframes pg{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fout{to{opacity:0;transform:scale(1.04)}}
@keyframes grow{from{width:0}}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#v>*{animation:pg .38s cubic-bezier(.2,.8,.2,1) both}
#v>*:nth-child(2){animation-delay:.05s}#v>*:nth-child(3){animation-delay:.1s}#v>*:nth-child(4){animation-delay:.15s}#v>*:nth-child(5){animation-delay:.2s}#v>*:nth-child(6){animation-delay:.25s}#v>*:nth-child(n+7){animation-delay:.3s}

.ov.out,.wl.out{animation:fout .3s ease forwards}

button{transition:transform .12s ease,background .25s,color .25s,opacity .2s}button:active{transform:scale(.96)}

<script>

const sig=f=>JSON.stringify([f.name,f.phone,f.addr,f.dp,f.entries,f.pays,f.olds]);
function push(){if(!U||!FS)return;clearTimeout(timer);timer=setTimeout(async()=>{try{
const col=FS.collection('users').doc(U.uid).collection('farmers'),bt=FS.batch();let n=0;
db.farmers.forEach(f=>{const g=sig(f);if(lastP[f.id]!==g){f.ts=Date.now();bt.set(col.doc(f.id),{json:JSON.stringify(f),ts:f.ts});lastP[f.id]=g;n++}});

if(n){flushSave();await bt.commit()}
st('☁️ Online save ho gaya')}catch(e){st('⚠️ Online save nahi hua (phone mein save hai)')}},500)}
let svT=0,lsWarned=false;

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+a};

const tot=f=>{const bill=f.entries.reduce((a,e)=>a+e.amt,0),old=(f.olds||[]).reduce((a,o)=>a+o.amt,0),paid=f.pays.reduce((a,p)=>a+p.amt,0),mn=f.entries.reduce((a,e)=>a+e.mins,0);return{bill,old,paid,mn,due:bill+old-paid}};

function farmCmp(a,b){const ua=_isUr(a.name),ub=_isUr(b.name);if(ua!==ub)return(ua?1:-1)*((FORCE_LANG||ST.lang)==='ur'?-1:1);return(ua?_cUr:_cEn).compare(String(a.name||'').trim(),String(b.name||'').trim())}
function toggAmt(){ST.hideAmt=!ST.hideAmt;saveST();home()}
function listH(q){q=(q||'').trim().toLowerCase();const a=TF().filter(f=>(!q||(f.name+' '+f.phone+' '+f.addr).toLowerCase().includes(q))&&(hf==='all'||(hf==='due'?tot(f).due>0:tot(f).due<=0)));a.sort(farmCmp);
return a.length?a.map(f=>{const t=tot(f);return`<button class="fm" onclick="open_('${f.id}')"><div style="display:flex;align-items:center;gap:12px;min-width:0">${av(f,46)}<div style="min-width:0"><b class="nt"><span class="nt">${esc(f.name)}</span></b><small><span class="nt">${esc([f.phone,f.addr].filter(Boolean).join(' • ')||'—')}</span> • ${dur(t.mn)||'0 min'}</small></div></div>${dueP(t)}</button>`}).join(''):'<div class="empty">'+(db.farmers.length?'Koi kisan nahi mila.':'Abhi koi kisan nahi. Upar se "Naya Kisan" dabayein.')+'</div>'}
let _ft=0;function filtD(){clearTimeout(_ft);_ft=setTimeout(filt,150)}
function filt(){$('list').innerHTML=listH($('q').value)}
function home(){cur=null;view='home';navR();twEnsure();
const all=TF().map(tot),bill=all.reduce((a,t)=>a+t.bill,0),paid=all.reduce((a,t)=>a+t.paid,0),old=all.reduce((a,t)=>a+t.old,0);
const hA=!!ST.hideAmt,MK='Rs ••••';
$('v').innerHTML=`${twBar()}<div class="card big"><span>Meri Total Kamai</span><button class="eyebtn" onclick="toggAmt()" aria-label="Hide / show">${hA?'🙈':'👁️'}</button><strong>${hA?MK:rs(bill+old)}</strong>
<div class="grid" style="margin-top:12px;text-align:left"><div><span>Wasool hua</span><b>${hA?MK:rs(paid)}</b></div><div><span>Baqaya</span><b>${hA?MK:rs(bill+old-paid)}</b></div></div></div>

<div id="addBox" class="card hide"><h2>Naya Kisan</h2><div class="dpick" onclick="$('fdp').click()"><span id="dpv" class="av" style="width:76px;height:76px;background:var(--g2);color:var(--g);font-size:28px">📷</span><span class="mut sm">Kisan ki tasveer (DP, marzi)</span></div><input id="fdp" type="file" accept="image/*" class="hide" onchange="pickDP(this,1)">
<div class="f"><label>Kisan ka naam</label><input id="fn" placeholder="Naam"></div>
<div class="f"><label>Number</label><input id="fp" type="tel" placeholder="03xx-xxxxxxx"></div>
<div class="f"><label>Rehaish</label><input id="fa" placeholder="Gaon / ilaqa"></div><div class="f"><label>Purana baqaya (pichle saal ka, marzi)</label><input id="fo" type="number" inputmode="numeric" placeholder="Rs"></div>
<button class="p" style="width:100%" onclick="addF()">Save karein</button></div>
${TF().length?'<input id="q" type="search" placeholder="🔍 Kisan ka naam dhoondein" oninput="filtD()" style="margin-bottom:10px"><div class="chips">'+[['all','Sab'],['due','Baqaya wale'],['ok','Hisab saaf']].map(x=>'<button class="ch'+(hf===x[0]?' on':'')+'" onclick="setHF(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>':''}<div id="list">${listH('')}</div>
`;wxFetch()}

function dpCut(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const n=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,160,160);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function binH(){const it=BIN.filter(b=>!b.twd||!BIN.some(x=>x.type==='tubewell'&&x.fid===b.twd)).sort((a,b)=>b.del-a.del);

(it.length?it.map(b=>{const d=b.data,left=Math.max(0,30-Math.floor((Date.now()-b.del)/864e5));
const ti=b.type==='tubewell'?'🚰 Tubewell':b.type==='kisan'?'👤 Kisan':b.type==='entry'?'💧 Entry':b.type==='purana'?'📜 Purana baqaya':'💰 Wasooli';
const inf=b.type==='tubewell'?`${d.n} kisan`:b.type==='kisan'?`${d.entries.length} entries • ${d.pays.length} wasooli`:b.type==='entry'?`${fmtD(d.date)} • ${t12(d.start)} → ${t12(d.end)} • ${rs(d.amt)}`:`${fmtD(d.date)} • ${rs(d.amt)}`;

function binRest(id){const b=BIN.find(x=>x.id===id);if(!b)return;
if(b.type==='tubewell'){const t=b.data.tw;if(!ST.tws.some(x=>x.id===t.id))ST.tws.splice(Math.min(Math.max(+b.data.idx||0,0),ST.tws.length),0,Object.assign({},t));
BIN.filter(x=>x.type==='kisan'&&x.twd===t.id).forEach(x=>{if(!db.farmers.some(f=>f.id===x.fid))db.farmers.push(x.data)});
BIN=BIN.filter(x=>x.id!==id&&x.twd!==t.id);saveST();twPush();saveBin();save();toast('Wapas aa gaya');setV();return}
if(b.type==='kisan'){if(db.farmers.some(f=>f.id===b.fid)){toast('Ye kisan pehle se maujood hai')}else db.farmers.push(b.data)}
else{const f=db.farmers.find(x=>x.id===b.fid);if(!f){alert('Pehle "'+b.fname+'" kisan ko wapas layein');return}(b.type==='entry'?f.entries:b.type==='purana'?(f.olds=f.olds||[]):f.pays).push(b.data)}
BIN=BIN.filter(x=>x.id!==id);saveBin();save();toast('Wapas aa gaya');setV()}
function binDel(id){const b=BIN.find(x=>x.id===id);if(!b||!confirm('Ye hamesha ke liye hat jayega, wapas nahi aayega. Pakka?'))return;const gs=b.type==='tubewell'?BIN.filter(x=>x.twd===b.fid):[];binPh(b);gs.forEach(binPh);BIN=BIN.filter(x=>x.id!==id&&!gs.includes(x));saveBin();setV()}
function binClear(){if(!BIN.length||!confirm('Deleted box ki saari cheezein hamesha ke liye hat jayengi. Pakka?'))return;BIN.forEach(binPh);BIN=[];saveBin();setV()}

document.querySelectorAll('[placeholder]').forEach(e=>{e._po=e._po||e.getAttribute('placeholder');e.setAttribute('placeholder',trT(e._po))})}
function applyDir(){const L=FORCE_LANG||ST.lang||'ro',h=document.documentElement;h.dir=L==='ur'?'rtl':'ltr';h.lang=L==='ur'?'ur':L==='en'?'en':'ur-Latn'}
function loadUF(){if((FORCE_LANG||ST.lang)!=='ur'||window._ufT)return;window._ufT=1;const h=document.documentElement.classList,d=ok=>{h.toggle('uf-ok',!!ok);h.toggle('uf-bad',!ok)};
try{document.fonts.load('18px JameelNoori','\u0627\u0628\u067E').then(f=>d(f&&f.length>0)).catch(()=>d(false))}catch(e){d(false)}}
async function fontDiag(){const L=[],add=(k,v)=>L.push(k+': '+v),ua=navigator.userAgent;
add('Browser',(ua.match(/(Chrome|CriOS|Firefox|Version)\/[\d.]+/)||['?'])[0]);add('Android',(ua.match(/Android [\d.]+/)||['-'])[0]);
try{const r=await fetch('jameel.woff');add('Font file','HTTP '+r.status+' '+(r.headers.get('content-type')||''));if(r.ok){const b=await r.arrayBuffer(),u=new Uint8Array(b.slice(0,4)),t=String.fromCharCode.apply(null,u);add('Size',Math.round(b.byteLength/1024)+' KB');add('Format',t==='wOFF'?'WOFF (theek)':t==='wOF2'?'WOFF2':(u[0]===0&&u[1]===1&&u[2]===0&&u[3]===0)||t==='OTTO'?'TTF/OTF (woff nahi)':'pehchan nahi hui ('+t+')')}}catch(e){add('Font file','nahi khuli ('+e.message+')')}
try{await document.fonts.load('18px JameelNoori','\u0627\u0628\u067E');add('Font browser mein load','\u0627'.length&&document.fonts.check('18px JameelNoori','\u0627\u0628\u067E')?'haan':'NAHI')}catch(e){add('Font load','fail ('+e.message+')')}
add('Urdu mode',ST.lang==='ur'?'on':'off');alert(L.join('\n'))}
function startLang(){applyDir();loadUF();new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(trNode);if(m.type==='characterData')trNode(m.target)})).observe(document.body,{childList:true,subtree:true,characterData:true});relang()}

function setLang(l){ST.lang=l;saveST();applyDir();loadUF();relang();(ST.role==='farmer'?fSetV:setV)();toast('Save ho gaya')}
const _al=window.alert.bind(window),_cf=window.confirm.bind(window),_pr=window.prompt.bind(window);
window.alert=m=>_al(trT(m));window.confirm=m=>_cf(trT(m));window.prompt=(m,d)=>_pr(trT(m),d);
function applyBk(x){const t=x.tws;delete x.tws;db=x;if(Array.isArray(t)&&t.length){const ok=t.filter(a=>a&&a.id&&a.name&&+a.rate>0);if(ok.length){ST.tws=ok;twInit();saveST();twPush()}}twEnsure();save()}
async function bk(){const data=JSON.stringify(Object.assign({},db,{tws:ST.tws}),null,2),fn='aslam-backup-'+today()+'.json',fl=new File([data],fn,{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl],title:fn});return}}catch(e){if(e&&e.name==='AbortError')return}
try{const u=URL.createObjectURL(fl),a=document.createElement('a');a.href=u;a.download=fn;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);toast('Backup download ho raha hai')}catch(e){alert('Backup nahi bana. "Backup copy karein" ka button istemal karein.')}}
async function bkCopy(){const t=JSON.stringify(Object.assign({},db,{tws:ST.tws}));try{await navigator.clipboard.writeText(t);toast('Backup copy ho gaya')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Backup copy ho gaya')}catch(x){alert('Copy nahi hua')}ta.remove()}}
function bkPaste(){const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML='<div class="sh"><h2>Backup paste karein</h2><textarea id="bkt" rows="8" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:13px" placeholder="Backup yahan paste karein"></textarea><div class="row" style="margin-top:10px"><button class="p" onclick="bkGo()">Restore karein</button><button class="s" onclick="this.closest(\'.ov\').remove()">Band karein</button></div></div>';document.body.appendChild(o)}
function bkGo(){try{const x=JSON.parse($('bkt').value);if(!Array.isArray(x.farmers))throw 0;if(!confirm('Maujooda data backup se badal jayega. Pakka?'))return;applyBk(x);$('bkt').closest('.ov').remove();home()}catch(e){alert('Yeh sahi backup file nahi hai')}}
function imp(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.farmers))throw 0;if(!confirm('Maujooda data backup se badal jayega. Pakka?'))return;applyBk(x);home()}catch(e){alert('Yeh sahi backup file nahi hai')}el.value=''};r.readAsText(fl)}

const CHL=[{v:59,d:'22 Oct 2026',it:[['new','App ka naam ab har jagah "Tubewell Khata" hai — purana "Aslam Tubewell" naam header, profile aur tamam jagahon se badal diya gaya hai. Profile ke dono khane (Urdu aur English) mein ab normal taur par "Tubewell Khata" / ٹیوب ویل کھاتہ likha aata hai. Purana naam save karne wala phone khud-ba-khud naye naam par tabdeel ho jayega.','ایپ کا نام اب ہر جگہ "ٹیوب ویل کھاتہ" ہے — پرانا "اسلم ٹیوب ویل" نام ہیڈر، پروفائل اور تمام جگہوں سے بدل دیا گیا ہے۔ پروفائل کے دونوں خانوں (اردو اور انگریزی) میں اب عام طور پر "Tubewell Khata" / ٹیوب ویل کھاتہ لکھا آتا ہے۔ پرانا نام محفوظ کرنے والا فون خود بخود نئے نام پر تبدیل ہو جائے گا۔','The app name is now "Tubewell Khata" everywhere — the old "Aslam Tubewell" name has been replaced in the header, profile and all other places. Both profile boxes (Urdu and English) now normally show "Tubewell Khata" / ٹیوب ویل کھاتہ. A phone with the old name saved will switch to the new name automatically.'],['fix','WhatsApp par bheji jane wali hisab statement ka title ab hamesha aap ka apna set kiya hua naam istemal karta hai (pehle ye hamesha "Aslam Tubewell" likh deta tha, chahe aap ne naam kuch bhi rakha ho).','واٹس ایپ پر بھیجی جانے والی حساب اسٹیٹمنٹ کا عنوان اب ہمیشہ آپ کا اپنا سیٹ کیا ہوا نام استعمال کرتا ہے (پہلے یہ ہمیشہ "اسلم ٹیوب ویل" لکھ دیتا تھا، چاہے آپ نے نام کچھ بھی رکھا ہو)۔','The title of the account statement sent on WhatsApp now always uses your own set name (previously it always wrote "Aslam Tubewell" no matter what name you had set).']]},{v:58,d:'22 Oct 2026',it:[['new','Headings ab aap ki chuni hui zuban ke mutabiq dikhti hain: English par sirf English, Urdu par sirf Urdu, aur Roman mode par English + Urdu dono. Pehle naye pages par kuch headings hamesha dono zuban mein dikhti theen. Saath hi bukin aur seting ke chhote likhay bhi zuban ke sath badalte hain.','عنوانات اب آپ کی چنی ہوئی زبان کے مطابق دکھتی ہیں: انگریزی پر صرف انگریزی، اردو پر صرف اردو، اور رومن موڈ پر انگریزی + اردو دونوں۔ پہلے نئے صفحات پر کچھ عنوانات ہمیشہ دونوں زبانوں میں دکھتے تھے۔ ساتھ ہی بکنگ اور سیٹنگ کے چھوٹے لکھائی بھی زبان کے ساتھ بدلتے ہیں۔','Headings now follow your chosen language: English shows only English, Urdu shows only Urdu, and Roman mode shows both. Previously some headings on the new pages always showed both languages. Button labels and small texts on booking and settings screens now change with the language too.'],['fix','App tez kar di gayi hai: booking ke updates ab background mein halkay tariqe se lagu hote hain (250ms ka faasla, aur Home sirf tab badalta hai jab nayi request ho), aur kisan ki tubewell list 60 second tak cache hoti hai — app zyada raftaar se chalti hai.','ایپ تیز کر دی گئی ہے: بکنگ کے اپڈیٹس اب پس منظر میں ہلکے طریقے سے لاگو ہوتے ہیں (250 ملی سیکنڈ کا فاصلہ، اور ہوم صرف تب بدلتا ہے جب نئی درخواست ہو)، اور کسان کی ٹیوب ویل فہرست 60 سیکنڈ تک محفوظ رہتی ہے — ایپ زیادہ رفتار سے چلتی ہے۔','Performance improved: booking updates now apply lightly in the background (250ms debounce, and Home only re-renders when the request badge actually changes), and the farmer tubewell list is cached for 60 seconds — the app feels faster.']]},{v:57,d:'22 Oct 2026',it:[['new','Ab app khulte waqt 2 account types milte hain: "Tubewell Owner / Accounts" (ٹیوب ویل والا کسان / حساب کتاب) jo apna hisab rakhta hai, aur "Water-Seeking Farmer" (پانی لگوانے والا کسان) jo tubewell dhoondh kar pani book karta hai. Apni type ek baar chunein — hamesha ke liye save ho jayegi aur har screen ka title English aur Urdu dono mein milega.','اب ایپ کھلتے وقت دو اکاؤنٹ قسمیں ملتی ہیں: "ٹیوب ویل والا کسان / حساب کتاب" جو اپنا حساب رکھتا ہے، اور "پانی لگوانے والا کسان" جو ٹیوب ویل ڈھونڈھ کر پانی بک کرتا ہے۔ اپنی قسم ایک بار چنیں — ہمیشہ کے لیے محفوظ ہو جائے گی اور ہر اسکرین کا عنوان انگریزی اور اردو دونوں میں ملے گا۔','The app now opens with 2 account types: "Tubewell Owner / Accounts" who keeps the khata, and "Water-Seeking Farmer" who finds a tubewell and books water. Pick your type once — it is saved forever, and every screen title comes in both English and Urdu.'],['new','Kisan (Farmer) account mein: code ya location se qareebi tubewell talash, rate aur available waqt dekhna, date/ghante chun kar pani ki booking bhejna, aur apni bookings ka hal (Qabool / Reject / Mukammal / Cancel) dekhna.','کسان (فارمر) اکاؤنٹ میں: کوڈ یا لوکیشن سے قریبی ٹیوب ویل تلاش، ریٹ اور دستیاب وقت دیکھنا، تاریخ/گھنٹے چن کر پانی کی بکنگ بھیجنا، اور اپنی بکنگز کا حال (منظور / مسترد / مکمل / منسوخ) دیکھنا۔','In the Farmer account: find tubewells by code or location, see the rate and available timings, send a water booking with date and hours, and track each booking status (Accepted / Rejected / Completed / Cancelled).'],['new','Malik (Owner) account mein naya Bookings page: unique tubewell code (copy/WhatsApp share), naye booking requests qabool/reject, pani ke ghante likh kar charge (Rs 500 fi ghanta default), payment Mark Paid, baqaya, kisanon ki list aur bookings report. Purana khata (kisan, wasooli, report) bilkul pehle jaisa chalta rahega.','مالک (اونر) اکاؤنٹ میں نیا بکنگز پیج: یونیک ٹیوب ویل کوڈ (کاپی/واٹس ایپ شیئر)، نئی بکنگ کی درخواستیں منظور/مسترد، پانی کے گھنٹے لکھ کر چارج (500 روپے فی گھنٹہ ڈیفالٹ)، ادائیگی مارک پیڈ، باقی رقم، کسانوں کی فہرست اور بکنگز رپورٹ۔ پرانا کھاتہ (کسان، وصولی، رپورٹ) بالکل پہلے جیسا چلتا رہے گا۔','New Bookings page in the Owner account: unique tubewell code (copy/WhatsApp share), accept or reject booking requests, record usage hours and charges (Rs 500 per hour default), mark payments received, outstanding balances, customer list and a bookings report. The existing khata (farmers, payments, reports) keeps working exactly as before.']]},{v:56,d:'22 Oct 2026',it:[['new','Meri Total Kamai card par aankh (👁️) ka button laga diya gaya hai — Easypaisa ki tarah dabane par paise chhup jate hain (Rs ••••) aur dobara dabane par wapas dikhte hain. App yaad rakhti hai ke aap ne paise chupaye hue hain.','میری کل کمائی کارڈ پر آنکھ کا بٹن لگا دیا گیا ہے — ایزی پیسہ کی طرح دبانے پر پیسہ چھپ جاتا ہے (Rs ••••) اور دوبارہ دبانے پر واپس دکھتا ہے۔ ایپ یاد رکھتی ہے کہ آپ نے پیسہ چھپایا ہوا ہے۔','The My Total Earnings card now has an eye button — like Easypaisa, tap it to hide the amounts (Rs ••••) and tap again to show them. The app remembers your choice.'],['new','Mausam card ab 4 din ka hai — 7 din ke chhote khano ke bajaye ab 4 bade aur saaf khane hain: baray emoji, wazeh temperature aur barish ka chance. Parhne mein aasan aur khoobsurat.','موسم کارڈ اب 4 دن کا ہے — 7 دن کے چھوٹے خانوں کے بجائے اب 4 بڑے اور صاف خانے ہیں: بڑے ایموجی، واضح درجہ حرارت اور بارش کا امکان۔ پڑھنے میں آسان اور خوبصورت۔','The weather card now shows 4 days — instead of 7 cramped cells there are now 4 large, clear tiles: bigger emoji, clearer temperatures and rain chance. Easier and nicer to read.']]},{v:55,d:'22 Oct 2026',it:[['new','Mausam card par ab 7 din ka poora forecast nazar aata hai (Aaj se agle 6 dino tak) — har din ka ziada/kam temperature aur barish ka chance bhi. Temperatures ab mehsoos-shuda (feels like), nami aur hawa ki raftaar ke saath bhi aate hain.','موسم کارڈ پر اب 7 دن کا پورا فورکاسٹ نظر آتا ہے (آج سے اگلے 6 دنوں تک) — ہر دن کا زیادہ/کم درجہ حرارت اور بارش کا امکان بھی۔ درجہ حرارت اب محسوس شدہ (فیلس لائک)، نمی اور ہوا کی رفتار کے ساتھ بھی آتا ہے۔','The weather card now shows a full 7-day forecast (today plus the next 6 days) with each day\'s high/low and chance of rain. Temperatures now come with feels-like, humidity and wind speed too.'],['new','Hawa ki quality (AQI) bhi ab mausam card par dikhti hai — dhuan/smog ke mausam mein kaam aati hai.','ہوا کی کوالٹی (AQI) بھی اب موسم کارڈ پر دکھتی ہے — دھوئیں/سموگ کے موسم میں کام آتی ہے۔','Air quality (AQI) is now also shown on the weather card — useful in the smog season.'],['fix','Mausam ki pehli service fail ho to app ab pehle MET Norway (7 din wali muft service) se koshish karti hai, phir wttr.in se — card aur bhi kam khali rahega. MSN/Apple jaisi apps apna band data istemal karti hain jo aap ke app ke liye legal aur bharosay ke tor par maujood nahi.','موسم کی پہلی سروس فیل ہو تو ایپ اب پہلے MET ناروے (7 دن والی مفت سروس) سے کوشش کرتی ہے، پھر wttr.in سے — کارڈ اب اور بھی کم خالی رہے گا۔ MSN/Apple جیسی ایپس اپنا بند ڈیٹا استعمال کرتی ہیں جو آپ کی ایپ کے لیے قانونی اور بھروسے کے طور پر موجود نہیں۔','If the primary service fails, the app now tries MET Norway (a free 7-day service) first, then wttr.in — so the card stays filled even more reliably. Apps like MSN/Apple use closed data that is not legally and reliably available for this app.']]},{v:54,d:'22 Oct 2026',it:[['fix','Mausam ab zyada sahi hai: naya din shuru hote hi ya internet wapas aane par mausam khud update ho jata hai. Purani khabar par din ke asli naam (Pir, Mangal waghera) likhe aate hain taake kal ka data Aaj samajh kar dhoka na khayein.','موسم اب زیادہ صحیح ہے: نیا دن شروع ہوتے ہی یا انٹرنیٹ واپس آنے پر موسم خود اپڈیٹ ہو جاتا ہے۔ پرانی خبر پر دن کے اصل نام (پیر، منگل وغیرہ) لکھے آتے ہیں تاکہ کل کا ڈیٹا آج سمجھ کر دھوکہ نہ کھائیں۔','Weather is now more accurate: whenever a new day starts or the internet returns, the forecast refreshes itself. Old reports show real day names (Mon, Tue, etc.) so yesterday\'s data is not mistaken for today.'],['new','Mausam card par ab "Abhi" ka temperature bhi nazar aata hai, aur barish ka alert aaj ke din ke liye bhi aata hai (pehle sirf agle dino ke liye tha).','موسم کارڈ پر اب "ابھی" کا درجہ حرارت بھی نظر آتا ہے، اور بارش کا الانٹ آج کے دن کے لیے بھی آتا ہے (پہلے صرف اگلے دنوں کے لیے تھا)।','The weather card now also shows the current temperature, and the rain alert now covers today as well (previously only future days).'],['fix','GPS se location set karte waqt ab aap ke gaon/deh ki asli jagah istemal hoti hai (qareebi shehar ke marks ke bajaye), aur ilaqay ka naam bhi khud aa jata hai. Shehar ki list mein 60 se zyada naye shehar/tehsil bhi shamil hain.','جی پی ایس سے لوکیشن سیٹ کرتے وقت اب آپ کے گاؤں/دہ کی اصل جگہ استعمال ہوتی ہے (قریبی شہر کے نشانات کے بجائے)، اور علاقے کا نام بھی خود آ جاتا ہے۔ شہروں کی فہرست میں 60 سے زیادہ نئے شہر/تحصیل بھی شامل ہیں۔','When set by GPS, the app now uses your exact village/area position (not the nearest city marker) and fetches the area name automatically. 60+ new cities/tehsils were also added to the list.'],['fix','Mausam ki pehli service band ho ya limit Poori ho jaye to app khud doosri muft service (wttr.in) se khabar laati hai, taake mausam khali ya ruka hua na dikhe.','موسم کی پہلی سروس بند ہو یا حد پوری ہو جائے تو ایپ خود دوسری مفت سروس (wttr.in) سے خبر لاتی ہے، تاکہ موسم خالی یا رکا ہوا نہ دکھے۔','If the primary weather service is down or rate-limited, the app automatically fetches from another free service (wttr.in) so the weather card does not stay empty.']]},{v:53,d:'21 Oct 2026',it:[['new','Naya Mausam card: Home par 4 din ka mausam (Aaj, Kal, Parso, agla din) aur barish ki khabar. Settings > Mausam se apna shehar chunein ya GPS se set karein. Offline hone par bhi purani khabar dikhti hai.','نیا موسم کارڈ: ہوم پر 4 دن کا موسم (آج، کل، پرسوں، اگلا دن) اور بارش کی خبر۔ سیٹنگز > موسم سے اپنا شہر چنیں یا جی پی ایس سے سیٹ کریں۔ آف لائن ہونے پر بھی پرانی خبر دکھتی ہے۔','New Weather card: a 4-day forecast on Home (Today, Tomorrow, Day after, next day) with rain alerts. Pick your city in Settings > Weather or set by GPS. Offline, the last report still shows.']]},{v:52,d:'19 Oct 2026',it:[['fix','Settings se "App dost ko bhejein" aur "App ka Logo" wale hisse hata diye gaye hain. App ab hamesha apna asli logo dikhati hai.','سیٹنگز سے "ایپ دوست کو بھیجیں" اور "ایپ کا لوگو" والے حصے ہٹا دیے گئے ہیں۔ ایپ اب ہمیشہ اپنا اصل لوگو دکھاتی ہے۔','The "Send the app to a friend" and "App Logo" sections were removed from Settings. The app now always shows its own logo.']]},{v:51,d:'19 Oct 2026',it:[['new','Kisano ki list ab tarteeb se aati hai: English/Roman mein A se Z, aur Urdu zuban mein ا se ے. Naye kisan khud sahi jagah par aa jate hain.','کسانوں کی لسٹ اب ترتیب سے آتی ہے: انگلش/رومن میں A سے Z، اور اردو زبان میں ا سے ے۔ نئے کسان خود صحیح جگہ پر آ جاتے ہیں۔','The farmer list is now in alphabetical order: A to Z in English/Roman and ا to ے in Urdu. New farmers go to the right place by themselves.']]},{v:50,d:'19 Oct 2026',it:[['fix','App tez ho gayi: kisano ki list, search aur report pehle se kai guna jaldi khulti hain, aur save karte waqt app ruk-ruk kar nahi chalti.','ایپ تیز ہو گئی: کسانوں کی لسٹ، سرچ اور رپورٹ پہلے سے کئی گنا جلدی کھلتی ہیں، اور سیو کرتے وقت ایپ رک رک کر نہیں چلتی۔','The app is faster: the farmer list, search and report open much quicker, and saving no longer makes the app freeze.'],['fix','Urdu mode mein aap ka likha hua naam (jaise "Kisan Ali") ab badalta nahi, jaisa likha waisa dikhta hai. "Purana Baqaya" ka heading bhi ab Urdu font mein aata hai.','اردو موڈ میں آپ کا لکھا ہوا نام اب بدلتا نہیں، جیسا لکھا ویسا دکھتا ہے۔ "پرانا باقی" کا عنوان بھی اب اردو فونٹ میں آتا ہے۔','In Urdu mode the names you type are no longer altered. The "Previous balance" heading now uses the Urdu font too.'],['fix','Chhoti screen par buttons aur filter ab bade (44 pixel) hain, taake aasani se dab sakein. Payment ki tasveer ke saath do baar dabane par ek hi payment banti hai.','چھوٹی اسکرین پر بٹن اور فلٹر اب بڑے (44 پکسل) ہیں تاکہ آسانی سے دب سکیں۔ پیمنٹ کی تصویر کے ساتھ دو بار دبانے پر ایک ہی پیمنٹ بنتی ہے۔','Buttons and filters are now larger (44px) for easier tapping. Tapping twice on a payment with a photo now creates only one payment.']]},{v:48,d:'19 Oct 2026',it:[['new','Naya theme "Royal Indigo" (indigo + warm sand + gold). Settings mein Theme chunein se select karein. Select na karein to aap ki purani theme waisi hi rahegi.','نیا تھیم "Royal Indigo" (انڈیگو + ریت + سنہری)۔ سیٹنگز میں تھیم چنیں سے منتخب کریں۔ منتخب نہ کریں تو آپ کی پرانی تھیم ویسی ہی رہے گی۔','New "Royal Indigo" theme (indigo + warm sand + gold). Pick it from Settings > Choose theme. If you do not pick it, your current theme stays as it is.']]},{v:47,d:'18 Oct 2026',it:[['fix','Internet band ho ya dheema ho to jis phone par pehle login tha, wahan app foran apne data ke saath khulti hai; login nahi mangti.','انٹرنیٹ بند ہو یا دھیما ہو تو جس فون پر پہلے لاگ ان تھا، وہاں ایپ فوراً اپنے ڈیٹا کے ساتھ کھلتی ہے؛ لاگ ان نہیں مانگتی۔','If the internet is off or slow, a phone that was already logged in opens straight into its data and does not ask for login.'],['new','Backup mein ab tubewell ke naam aur rate bhi aate hain, aur restore par wapas ban jate hain.','بیک اپ میں اب ٹیوب ویل کے نام اور ریٹ بھی آتے ہیں، اور ریسٹور پر واپس بن جاتے ہیں۔','Backups now include tubewell names and rates and bring them back on restore.']]},{v:45,d:'18 Oct 2026',it:[['fix','App ab bohat jaldi khulti hai: dheemi internet par bhi pehle purani copy foran khulti hai aur naya version peeche se aa jata hai.','ایپ اب بہت جلدی کھلتی ہے: دھیمے انٹرنیٹ پر بھی پہلے پرانی کاپی فوراً کھلتی ہے اور نیا ورژن پیچھے سے آ جاتا ہے۔','The app now opens much faster: even on slow internet it opens instantly from the saved copy and the new version arrives in the background.']]},{v:44,d:'18 Oct 2026',it:[['new','Logout se pehle app dekhti hai ke aap ka sara data online save ho chuka hai; na hua to pehle poochti hai.','لاگ آؤٹ سے پہلے ایپ دیکھتی ہے کہ آپ کا سارا ڈیٹا آن لائن محفوظ ہو چکا ہے؛ نہ ہوا تو پہلے پوچھتی ہے۔','Before logging out, the app checks that all your data is saved online and asks you first if it is not.']]},{v:43,d:'18 Oct 2026',it:[['fix','Login/Register screen ab hamesha English aur seedhi (left-to-right) hai. Email Urdu mein bhi ulta nahi likha jata.','لاگ ان/رجسٹر اسکرین اب ہمیشہ انگلش اور سیدھی (بائیں سے دائیں) ہے۔ ای میل اردو میں بھی الٹی نہیں لکھی جاتی۔','The Login/Register screen is now always English and left-to-right. Emails are no longer scrambled in Urdu.']]},{v:42,d:'17 Oct 2026',it:[['fix','Ab login ke bina dashboard ya data nahi khulta. Har naye phone par pehle login/signup screen aati hai.','اب لاگ ان کے بغیر ڈیش بورڈ یا ڈیٹا نہیں کھلتا۔ ہر نئے فون پر پہلے لاگ ان/سائن اپ اسکرین آتی ہے۔','Dashboard and data no longer open without login. Every new phone starts at the login/signup screen.'],['fix','Logout par is phone ka sara data, tasveerein aur cache saaf ho jata hai.','لاگ آؤٹ پر اس فون کا سارا ڈیٹا، تصویریں اور کیش صاف ہو جاتا ہے۔','Logout now clears all data, photos and cache on this phone.']]},{v:41,d:'17 Oct 2026',it:[['fix','Tareekh ka text ab dabbe mein poora aur saaf dikhta hai (chhoti screen par bhi), aur nichli menu chhoti screen par poori aati hai.','تاریخ کی لکھائی اب ڈبے میں پوری اور صاف دکھتی ہے (چھوٹی اسکرین پر بھی)، اور نیچے والا مینو چھوٹی اسکرین پر پورا آتا ہے۔','The date text now shows fully and clearly inside its box (even on small screens), and the bottom menu fits small screens.']]},{v:40,d:'17 Oct 2026',it:[['fix','Android par tareekh ke aage calendar icon ab text par nahi charhta; tareekh beech mein saaf dikhti hai.','اینڈرائیڈ پر تاریخ کے آگے کیلنڈر آئیکن اب لکھائی پر نہیں چڑھتا؛ تاریخ بیچ میں صاف دکھتی ہے۔','On Android the calendar icon no longer overlaps the date; the date is shown clearly in the middle.'],['fix','Call aur WhatsApp ke button chhoti screen par theek aate hain, aur poori screen ek side par nahi khisakti.','کال اور واٹس ایپ کے بٹن چھوٹی اسکرین پر ٹھیک آتے ہیں، اور پوری اسکرین ایک طرف نہیں کھسکتی۔','Call and WhatsApp buttons fit on small screens and the whole screen no longer slides sideways.']]},{v:39,d:'17 Oct 2026',it:[['new','Tubewell ab delete ho sakta hai (Settings mein Tubewell card). Delete karne par tubewell aur uske kisan Deleted Box mein 30 din rehte hain, wahan se wapas la sakte hain.','ٹیوب ویل اب ڈیلیٹ ہو سکتا ہے (سیٹنگز میں ٹیوب ویل کارڈ)۔ ڈیلیٹ کرنے پر ٹیوب ویل اور اس کے کسان ڈیلیٹڈ باکس میں 30 دن رہتے ہیں، وہاں سے واپس لا سکتے ہیں۔','A tubewell can now be deleted (Tubewell card in Settings). It and its farmers stay in the Deleted Box for 30 days and can be restored.']]},{v:38,d:'17 Oct 2026',it:[['new','Ab do (ya zyada) tubewell alag alag rakh sakte hain. Home par upar se tubewell badlein; har tubewell ke kisan, entries, wasooli aur rate alag hain.','اب دو (یا زیادہ) ٹیوب ویل الگ الگ رکھ سکتے ہیں۔ ہوم پر اوپر سے ٹیوب ویل بدلیں؛ ہر ٹیوب ویل کے کسان، اندراجات، وصولی اور ریٹ الگ ہیں۔','You can now keep two (or more) tubewells separate. Switch tubewell at the top of Home; each has its own farmers, entries, payments and rate.'],['new','Tubewell add karne ya naam badalne ke liye Settings kholein. Report mein sab tubewell ka jama hisab bhi hai.','ٹیوب ویل شامل کرنے یا نام بدلنے کے لیے سیٹنگز کھولیں۔ رپورٹ میں تمام ٹیوب ویلز کا جمع حساب بھی ہے۔','Open Settings to add a tubewell or rename it. Report also shows the combined account of all tubewells.']]},{v:37,d:'17 Oct 2026',it:[['new','Tareekh ab har jagah 16-10-2026 (din-mahina-saal) ki tarah dikhti hai.','تاریخ اب ہر جگہ 16-10-2026 (دن-مہینہ-سال) کی طرح نظر آتی ہے۔','Dates now show as 16-10-2026 (day-month-year) everywhere.'],['new','\"WhatsApp par bhejein\" button se tasveer save hoti hai aur us kisan ki chat khulti hai.','\"واٹس ایپ پر بھیجیں\" بٹن سے تصویر محفوظ ہوتی ہے اور اس کسان کی چیٹ کھلتی ہے۔','The \"Send on WhatsApp\" button saves the image and opens that farmer\'s chat.'],['new','Hisab ki tasveer ke neeche naya \"Tasveer download karein\" button.','حساب کی تصویر کے نیچے نیا \"تصویر ڈاؤن لوڈ کریں\" بٹن۔','New \"Download image\" button below the account image.'],['new','Meri Total Kamai mein ab Purana baqaya bhi shamil hai.','میری کل کمائی میں اب پرانا باقی بھی شامل ہے۔','My Total Earnings now includes the previous balance.'],['fix','Hisab ki tasveer ab bohat jaldi banti hai.','حساب کی تصویر اب بہت جلدی بنتی ہے۔','The account image is now created much faster.']]},{v:31,d:'16 Oct 2026',it:[['new','Upar se "Pani ka hisab" likhai hata di gayi. Rate ka nishan ab "Saved online" ke saath ek hi line mein hai.','اوپر سے "پانی کا حساب" لکھائی ہٹا دی گئی۔ ریٹ کا نشان اب "Saved online" کے ساتھ ایک ہی لائن میں ہے۔','The "Water account" text at the top is removed. The Rate badge now sits on the same line as "Saved online".']]},{v:30,d:'16 Oct 2026',it:[['new','Entry, purana baqaya ya wasooli save karne par chhoti si awaaz aati hai (Settings mein band bhi kar sakte hain).','انٹری، پرانا باقی یا وصولی محفوظ کرنے پر چھوٹی سی آواز آتی ہے (سیٹنگز میں بند بھی کر سکتے ہیں)۔','A short sound plays when you save an entry, previous balance or payment (can be turned off in Settings).'],['new','Upar Rate ka nishan ab Online wale nishan jaisa saaf aur halka hai.','اوپر ریٹ کا نشان اب آن لائن والے نشان جیسا صاف اور ہلکا ہے۔','The Rate badge at the top now matches the Online badge.']]},{v:29,d:'16 Oct 2026',it:[['fix','App install ke baad pehle andar ka hissa nazar aa kar phir login aata tha. Ab seedha login page khulta hai.','ایپ انسٹال کے بعد پہلے اندر کا حصہ نظر آ کر پھر لاگ اِن آتا تھا۔ اب سیدھا لاگ اِن پیج کھلتا ہے۔','After installing, the app used to flash the inside screen before the login page. It now opens straight on login.']]},{v:28,d:'16 Oct 2026',it:[
